                    showToast('Ride PIN copied. Share it only with your driver after pickup.');
                } catch (error) {
                    showToast(getErrorMessage(error), true);
                }
            };
            const driverButton = document.getElementById('btn-open-driver');
            if (driverButton) driverButton.onclick = () => switchMode('driver');
            const driverHistoryButton = document.getElementById('btn-driver-history');
            if (driverHistoryButton) driverHistoryButton.onclick = renderDriverHistory;
            const switchCustomerButton = document.getElementById('btn-switch-customer');
            if (switchCustomerButton) switchCustomerButton.onclick = () => changeUserRole('customer', switchCustomerButton);
            const becomeDriverButton = document.getElementById('btn-become-driver');
            if (becomeDriverButton) becomeDriverButton.onclick = () => changeUserRole('driver', becomeDriverButton);
            document.getElementById('btn-logout').onclick = () => {
                showModal("Logout?", "You will need to sign in again.", async () => {
                    try {
                        const { error } = await supabase.auth.signOut();
                        if (error) throw error;
                    }
                    catch (error) { showToast(getErrorMessage(error), true); }
                });
            };
        }

        // --- DRIVER ---
        function renderDriverDashboard() {
            cleanupListeners();
            mainContent.innerHTML = `<div class="text-center mt-3"><div class="loader" style="margin: 0 auto;"></div></div>`;
            const unsubActive = watchRows('rides', [['driver_id', currentUser.uid]], 'created_at', null, rows => {
                const activeRide = rows.map(mapRide).find(ride => ['accepted', 'arrived', 'in_progress'].includes(ride.status));
                if (activeRide) {
                    if (availableRidesUnsub) {
                        availableRidesUnsub();
                        availableRidesUnsub = null;
                    }
                    renderDriverActiveRideUI(activeRide.id, activeRide);
                }
                else { renderAvailableRides(); }
            }, (error) => showToast(`Unable to load your active ride: ${getErrorMessage(error)}`, true));
            listeners.push(unsubActive);
        }

        function renderAvailableRides() {
            mainContent.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <div><h2 class="font-bold text-primary text-lg">Available Rides</h2><p class="text-muted text-sm">Accept a ride to start earning.</p></div>
                    <div class="flex gap-2">
                        <button type="button" class="btn-outline btn-sm" id="btn-driver-history">My History</button>
                        <button type="button" class="btn-outline btn-sm" id="btn-refresh-rides">Refresh</button>
                    </div>
                </div>
                <div id="rides-list" aria-live="polite"><div class="loader" style="margin: 20px auto;" role="status" aria-label="Loading available rides"></div></div>
            `;
            setupRideChat(null);
            document.getElementById('btn-refresh-rides').onclick = () => renderDriverDashboard();
            document.getElementById('btn-driver-history').onclick = renderDriverHistory;

            if (availableRidesUnsub) availableRidesUnsub();
            availableRidesUnsub = watchRows('ride_requests', [['status', 'requested']], 'created_at', null, rows => {
                const listEl = document.getElementById('rides-list'); if (!listEl) return;
                if (!rows.length) { listEl.innerHTML = `<div class="empty-state mt-3">No rides available right now. New requests will appear here.</div>`; return; }
                
                let html = ''; let count = 0;
                const now = Date.now();

                rows.map(mapRide)
                    .slice()
                    .sort((a, b) => {
                        const timeA = new Date(a.createdAt || 0).getTime();
                        const timeB = new Date(b.createdAt || 0).getTime();
                        return timeB - timeA;
                    })
                    .forEach(ride => {
                    if(ride.customerUid === currentUser.uid) return; 
                    
                    // TIME FILTER: Skip rides older than 30 minutes
                    if (ride.createdAt) {
                        const rideTime = new Date(ride.createdAt).getTime();
                        if (Number.isNaN(rideTime)) return;
                        if (now - rideTime > 30 * 60 * 1000) return; // Hide old rides
                    }

                    count++;
                    html += `
                    <div class="card">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs text-muted">${formatDate(ride.createdAt)}</span>
                            <span class="badge badge-requested">${escapeHTML(ride.rideType || 'Ride')}</span>
                        </div>
                        <p class="text-sm status-message"><span class="text-muted">From:</span> <span class="font-bold">${escapeHTML(ride.pickup)}</span></p>
                        <p class="text-sm mb-2 status-message"><span class="text-muted">To:</span> <span class="font-bold">${escapeHTML(ride.destination)}</span></p>
                        <button type="button" class="btn-primary w-full accept-btn" data-id="${escapeHTML(ride.id)}">Accept Ride</button>
                    </div>`;
                    });
                
                listEl.innerHTML = count === 0 ? `<div class="empty-state mt-3">There are no new rides available right now.</div>` : html;
                
                listEl.querySelectorAll('.accept-btn').forEach(btn => {
                    btn.onclick = async (e) => {
                        const acceptButton = e.currentTarget;
                        const rideId = acceptButton.dataset.id;
                        setLoading(acceptButton, true);
                        try {
                            const { error } = await supabase.rpc('accept_ride', { p_ride_id: rideId });
                            if (error) throw error;
                            showToast("Ride accepted!");
                        } catch (error) {
                            showToast(getErrorMessage(error), true);
                            setLoading(acceptButton, false);
                        }
                    };
                });
            }, error => showToast(`Unable to load available rides: ${getErrorMessage(error)}`, true));
        }

        function renderDriverActiveRideUI(rideId, ride) {
            let actionSection = ''; let cancelBtnSection = '';
            const pickupMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ride.pickup)}`;
            const dropMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ride.destination)}`;
            
            if (ride.status === 'accepted') {
                actionSection = `<button class="btn-primary w-full mt-2" id="btn-arrived">I've Arrived at Pickup</button>`;
                cancelBtnSection = `<button class="btn-danger w-full mt-2" id="btn-release-ride">Cancel & Release Ride</button>`;
            } else if (ride.status === 'arrived') {
                const fareAccepted = ride.fareStatus === 'accepted';
                actionSection = `<form id="form-start-ride" class="card mt-2"><h3 class="font-bold mb-1">Start ride with customer PIN</h3><label for="start-ride-pin">Customer's 6-digit ride PIN</label><input id="start-ride-pin" name="startPin" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="Enter PIN given by customer"><p class="text-sm text-muted mt-1">Ask the customer for their permanent PIN after pickup. Five incorrect attempts lock PIN verification for 15 minutes.</p>${fareAccepted ? '' : `<p class="text-sm text-danger mt-1">The customer must accept your fare before the ride can start.</p>`}<button type="submit" class="btn-primary w-full mt-2" id="btn-start-ride" ${fareAccepted ? '' : 'disabled'}>${fareAccepted ? 'Verify PIN & Start Ride' : 'Waiting for fare acceptance'}</button></form>`;
                cancelBtnSection = `<button class="btn-danger w-full mt-2" id="btn-release-ride">Cancel & Release Ride</button>`;
            } else if (ride.status === 'in_progress') {
                actionSection = `<button class="btn-primary w-full mt-2" id="btn-complete-ride">Complete Ride</button>`;
            }

            mainContent.innerHTML = `
                <div class="flex justify-between items-center mb-1"><h2 class="font-bold text-primary text-lg">Active Ride</h2><span class="badge badge-${escapeHTML(ride.status)}">${displayStatus(ride.status)}</span></div>
                ${renderTimeline(ride.status)}
                <div class="card" style="border-color: var(--primary);">
                    <div class="flex justify-between items-center mb-3">
                        <div class="status-message"><p class="text-xs text-muted">CUSTOMER</p><p class="font-bold">${escapeHTML(ride.customerName || 'Customer')}</p><p class="text-sm">${escapeHTML(ride.phone || 'Phone not provided')}</p>${/^[+0-9() .-]{5,30}$/.test(String(ride.phone || '')) ? `<a class="btn-outline btn-sm mt-1" href="tel:${encodeURIComponent(ride.phone)}">Call customer</a>` : ''}</div>
                        <button type="button" class="btn-outline btn-sm" id="btn-copy-details">Copy Info</button>
                    </div>
                    <div class="map-container"><iframe title="Map showing ride pickup" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${encodeURIComponent(ride.pickup)}&output=embed"></iframe></div>
                    <div class="flex justify-between items-center mb-2">
                        <div class="status-message"><p class="text-xs text-muted">PICKUP</p><p class="font-bold text-sm">${escapeHTML(ride.pickup)}</p></div>
                        <a href="${pickupMapUrl}" target="_blank" rel="noopener noreferrer" class="btn-primary btn-sm" style="text-decoration:none;">Open Map</a>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="status-message"><p class="text-xs text-muted">DROP</p><p class="font-bold text-sm">${escapeHTML(ride.destination)}</p></div>
                        <a href="${dropMapUrl}" target="_blank" rel="noopener noreferrer" class="btn-primary btn-sm" style="text-decoration:none;">Open Map</a>
                    </div>
                </div>
                ${renderFare(ride, 'driver')}
                ${['accepted', 'arrived'].includes(ride.status) && ride.fareStatus !== 'accepted' ? `<form id="form-fare-quote" class="card"><label for="fare-quote">Your price (INR)</label><input id="fare-quote" name="fareQuote" type="number" min="1" max="1000000" step="1" inputmode="numeric" value="${Number.isSafeInteger(ride.fareQuote) && ride.fareQuote > 0 ? ride.fareQuote : ''}" required><p class="text-sm text-muted mt-1">Enter the total price you and the customer can agree on. No distance-based estimate is calculated.</p><button type="submit" class="btn-primary w-full mt-2" id="btn-send-fare">Send price to customer</button></form>` : ''}
                ${['accepted', 'arrived', 'in_progress'].includes(ride.status) ? `<section class="card chat-panel" id="ride-chat" aria-label="Chat with customer"><h3 class="font-bold mb-1">Ride chat</h3><div id="chat-messages" class="chat-messages" aria-live="polite"><p class="text-sm text-muted">Loading messages…</p></div><form id="form-chat" class="chat-compose"><input id="chat-input" type="text" maxlength="1000" autocomplete="off" aria-label="Message to customer" placeholder="Message your customer" required><button type="submit" class="btn-primary btn-sm" id="btn-send-chat">Send</button></form></section>` : ''}
                ${actionSection} ${cancelBtnSection}
            `;
            if (['accepted', 'arrived', 'in_progress'].includes(ride.status)) setupRideChat(rideId);

            const fareForm = document.getElementById('form-fare-quote');
            if (fareForm) fareForm.onsubmit = async event => {
                event.preventDefault();
                const button = document.getElementById('btn-send-fare');
                const amount = Number(document.getElementById('fare-quote').value);
                if (!Number.isSafeInteger(amount) || amount < 1 || amount > 1000000) {
                    showToast('Enter a whole-number fare from ₹1 to ₹10,00,000.', true);
                    return;
                }
                setLoading(button, true);
                try {
                    const { error } = await supabase.rpc('offer_ride_fare', {
                        p_ride_id: rideId,
                        p_fare_quote: amount
                    });
                    if (error) throw error;
                    showToast('Price sent to the customer.');
                } catch (error) {
                    showToast(getErrorMessage(error), true);
                    setLoading(button, false);
                }
            };

            document.getElementById('btn-copy-details').onclick = async () => {
                const text = `FLASH Ride:\nCustomer: ${ride.customerName}\nPhone: ${ride.phone}\nPickup: ${ride.pickup}\nDrop: ${ride.destination}`;
                try {
                    if (!navigator.clipboard?.writeText) throw new Error('Clipboard access is unavailable in this browser.');
                    await navigator.clipboard.writeText(text);
                    showToast("Details copied!");
                } catch (error) { showToast(getErrorMessage(error), true); }
            };

            const btnArrived = document.getElementById('btn-arrived');
            if (btnArrived) btnArrived.onclick = () => transitionDriverRide(rideId, 'accepted', 'arrived', btnArrived, 'Arrived!');

            const startRideForm = document.getElementById('form-start-ride');
            if (startRideForm) startRideForm.onsubmit = async event => {
                event.preventDefault();
                if (ride.fareStatus !== 'accepted') {
                    showToast('Wait for the customer to accept the fare before starting the ride.', true);
                    return;
                }
                const pinInput = document.getElementById('start-ride-pin');
                const button = document.getElementById('btn-start-ride');
                const pin = pinInput.value;
                if (!/^\d{6}$/.test(pin)) {
                    showToast('Enter the customer’s six-digit ride PIN.', true);
                    return;
                }
                const started = await transitionDriverRide(rideId, 'arrived', 'in_progress', button, 'Ride started!', pin);
                if (!started) {
                    pinInput.value = '';
                    pinInput.focus();
                }
            };

            const btnComplete = document.getElementById('btn-complete-ride');
            if (btnComplete) btnComplete.onclick = () => transitionDriverRide(rideId, 'in_progress', 'completed', btnComplete, 'Ride completed!');

            const btnRelease = document.getElementById('btn-release-ride');
            if (btnRelease) {
                btnRelease.onclick = () => {
                    showModal("Release Ride?", "This ride will go back to the pool for other drivers.", async () => {
                        setLoading(btnRelease, true);
                        try {
                            const { error } = await supabase.rpc('release_ride', { p_ride_id: rideId });
                            if (error) throw error;
                            showToast("Ride released.");
                        } catch (error) { showToast(getErrorMessage(error), true); setLoading(btnRelease, false); }
                    });
                };
            }
        }

        async function transitionDriverRide(rideId, expectedStatus, nextStatus, button, successMessage, startPin = null) {
            setLoading(button, true);
            try {
                const { data, error } = await supabase.rpc('transition_driver_ride', {
                    p_ride_id: rideId,
                    p_expected_status: expectedStatus,
                    p_next_status: nextStatus,
                    p_start_pin: startPin
                });
                if (error) throw error;
                if (data !== true) {
                    showToast('PIN is incorrect or temporarily locked after five failed attempts. Confirm the PIN with the customer; if locked, try again in 15 minutes.', true);
                    setLoading(button, false);
                    return false;
                }
                showToast(successMessage);
                return true;
            } catch (error) {
                showToast(getErrorMessage(error), true);
                setLoading(button, false);
                return false;
            }
        }

        function renderDriverHistory() {
            cleanupListeners();
            mainContent.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-primary text-lg">My Ride History</h2>
                    <button type="button" class="btn-outline btn-sm" id="btn-back-to-rides">Available rides</button>
                </div>
                <div class="text-center mt-3"><div class="loader" style="margin: 0 auto;" role="status" aria-label="Loading ride history"></div></div>
            `;
            document.getElementById('btn-back-to-rides').onclick = renderDriverDashboard;
            const unsubscribe = watchRows('rides', [['driver_id', currentUser.uid]], 'created_at', null, rows => {
                const completed = rows
                    .map(mapRide)
                    .filter(ride => ['completed', 'cancelled'].includes(ride.status))
                    .sort((a, b) => {
                        const dateA = a.completedAt || a.cancelledAt || a.createdAt;
                        const dateB = b.completedAt || b.cancelledAt || b.createdAt;
                        const timeA = dateA?.toMillis ? dateA.toMillis() : new Date(dateA || 0).getTime();
                        const timeB = dateB?.toMillis ? dateB.toMillis() : new Date(dateB || 0).getTime();
                        return timeB - timeA;
                    });
                const header = `<div class="flex justify-between items-center mb-2"><h2 class="font-bold text-primary text-lg">My Ride History</h2><button type="button" class="btn-outline btn-sm" id="btn-back-to-rides">Available rides</button></div>`;
                if (!completed.length) {
                    mainContent.innerHTML = `${header}<div class="empty-state">Completed rides will appear here.</div>`;
                } else {
                    const cards = completed.map(ride => `<div class="card"><div class="flex justify-between mb-1"><span class="badge badge-${ride.status}">${displayStatus(ride.status)}</span><span class="text-xs text-muted">${formatDate(ride.completedAt || ride.cancelledAt || ride.createdAt)}</span></div><p class="text-sm status-message"><span class="text-muted">From:</span> ${escapeHTML(ride.pickup || 'Pickup unavailable')}</p><p class="text-sm status-message"><span class="text-muted">To:</span> ${escapeHTML(ride.destination || 'Destination unavailable')}</p></div>`).join('');
                    mainContent.innerHTML = `${header}${cards}`;
                }
                document.getElementById('btn-back-to-rides').onclick = renderDriverDashboard;
            }, error => showToast(`Unable to load ride history: ${getErrorMessage(error)}`, true));
            listeners.push(unsubscribe);
        }
    </script>
</body>
</html>
