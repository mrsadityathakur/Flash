<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f6f6f6">
    <meta name="description" content="FLASH - Fast rides. Fair for everyone.">
    <meta name="color-scheme" content="light">
    <title>FLASH - Fast rides. Fair for everyone.</title>
    <style>
        :root {
            --bg: #f3f4f6;
            --bg-alt: #eef1f2;
            --surface: #ffffff;
            --surface-strong: #f6f6f6;
            --surface-light: #eceef1;
            --primary: #06c167;
            --primary-strong: #05a958;
            --text: #111111;
            --text-muted: #5f6368;
            --danger: #e24d4d;
            --success: #1f9d5a;
            --radius: 18px;
            --header-height: 64px;
            --nav-height: 76px;
            --shadow-soft: 0 10px 28px rgba(17, 17, 17, 0.08);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #f4f5f6 0%, #eef1f3 100%);
            color: var(--text);
            height: 100vh; height: 100dvh;
            overflow: hidden; display: flex; flex-direction: column;
        }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .w-full { width: 100%; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }
        .text-primary { color: var(--primary); }
        .text-danger { color: var(--danger); }
        .text-sm { font-size: 0.85rem; }
        .text-lg { font-size: 1.2rem; }
        .font-bold { font-weight: 700; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }

        button {
            font-family: inherit; border: none; border-radius: var(--radius); font-weight: 700;
            font-size: 1rem; cursor: pointer; transition: transform 0.18s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex; align-items: center; justify-content: center; padding: 16px 20px;
            min-height: 48px; touch-action: manipulation;
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid var(--primary); outline-offset: 3px;
        }
        
        .btn-primary {
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-strong) 100%);
            color: #ffffff;
            box-shadow: 0 12px 24px rgba(6, 193, 103, 0.2);
        }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 14px 30px rgba(6, 193, 103, 0.28); }
        .btn-outline {
            background: #ffffff;
            border: 1px solid rgba(17, 17, 17, 0.12);
            color: var(--text);
        }
        .btn-danger {
            background: rgba(226, 77, 77, 0.08);
            color: var(--danger);
            border: 1px solid rgba(226, 77, 77, 0.2);
        }
        .btn-sm { padding: 10px 16px; font-size: 0.82rem; border-radius: 12px; }

        input, select, textarea {
            width: 100%; background: #ffffff; border: 1px solid rgba(17, 17, 17, 0.12);
            color: var(--text); padding: 16px; border-radius: 14px; font-family: inherit;
            font-size: 1rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s ease;
            box-shadow: 0 1px 0 rgba(17,17,17,0.02);
        }
        input:focus, select:focus, textarea:focus { border-color: rgba(6, 193, 103, 0.7); box-shadow: 0 0 0 4px rgba(6, 193, 103, 0.12); }
        input::placeholder, textarea::placeholder { color: #9aa0a6; }
        textarea { resize: vertical; min-height: 80px; }
        label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
        
        .card {
            background: linear-gradient(180deg, #ffffff 0%, #fafafb 100%);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(17, 17, 17, 0.06);
            box-shadow: var(--shadow-soft);
        }
        
        .badge {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 7px 12px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
            border: 1px solid rgba(17,17,17,0.08);
        }
        .badge-requested { background: rgba(6, 193, 103, 0.08); color: var(--primary); }
        .badge-accepted { background: rgba(31, 157, 90, 0.1); color: var(--success); }
        .badge-arrived { background: rgba(44, 125, 255, 0.08); color: #2a73ff; }
        .badge-in_progress { background: rgba(6, 193, 103, 0.08); color: var(--primary); }
        .badge-completed { background: rgba(17, 17, 17, 0.05); color: var(--text-muted); }

        #app { display: flex; flex-direction: column; height: 100%; position: relative; }
        
        #splash-screen {
            position: absolute; inset: 0; overflow: hidden; isolation: isolate;
            background: linear-gradient(180deg, #fafafa 0%, #eef3f0 100%); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        #splash-screen::before, #splash-screen::after { position: absolute; z-index: -1; border: 1px solid rgba(6, 193, 103, 0.2); border-radius: 50%; content: ""; pointer-events: none; }
        #splash-screen::before { width: min(92vw, 620px); aspect-ratio: 1; }
        #splash-screen::after { width: min(76vw, 500px); aspect-ratio: 1; border-color: rgba(17,17,17,0.06); }
        .splash-brand { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 24px; }
        .splash-eyebrow { display: flex; align-items: center; gap: 9px; color: #6d7278; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; }
        .splash-eyebrow::before, .splash-eyebrow::after { width: 22px; height: 1px; background: linear-gradient(90deg, transparent, rgba(6, 193, 103, 0.8)); content: ""; }
        .splash-eyebrow::after { transform: rotate(180deg); }
        .splash-emblem { position: relative; display: grid; place-items: center; width: clamp(220px, 61vw, 310px); aspect-ratio: 1; margin: 25px 0 18px; border: 1px solid rgba(6, 193, 103, 0.22); border-radius: 50%; background: radial-gradient(circle, rgba(6, 193, 103, 0.12), rgba(6, 193, 103, 0.02) 58%, transparent 70%); box-shadow: 0 14px 40px rgba(6, 193, 103, 0.08); }
        .splash-emblem::before, .splash-emblem::after { position: absolute; border: 1px solid rgba(17, 17, 17, 0.08); border-radius: 50%; content: ""; pointer-events: none; }
        .splash-emblem::before { inset: 9px; }
        .splash-emblem::after { inset: -12px; border-style: dashed; animation: splash-orbit 36s linear infinite; }
        .splash-logo { width: 82%; height: 82%; border-radius: 50%; object-fit: contain; filter: drop-shadow(0 0 20px rgba(6, 193, 103, 0.18)); animation: splash-float 3.4s ease-in-out infinite; }
        .splash-wordmark { color: #111111; font-size: clamp(3.3rem, 14vw, 5.2rem); font-weight: 950; font-style: italic; letter-spacing: -0.095em; line-height: 0.95; padding-right: 0.095em; }
        .splash-tagline { margin-top: 15px; color: #4d5359; font-size: clamp(0.68rem, 2.5vw, 0.82rem); font-weight: 650; letter-spacing: 0.17em; text-transform: uppercase; }
        .splash-loading { display: flex; flex-direction: column; align-items: center; gap: 13px; margin-top: 42px; color: #5d646b; font-size: 0.64rem; font-weight: 750; letter-spacing: 0.22em; text-transform: uppercase; }
        .splash-loading::before { width: 128px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--primary), transparent); background-size: 200% 100%; content: ""; animation: splash-progress 1.5s ease-in-out infinite; }
        @keyframes splash-float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.02); } }
        @keyframes splash-progress { from { background-position: 100% 0; } to { background-position: -100% 0; } }
        @keyframes splash-orbit { to { transform: rotate(360deg); } }
        @media (max-height: 620px) {
            .splash-brand { padding-top: 12px; padding-bottom: 12px; }
            .splash-emblem { width: min(42vh, 220px); margin: 12px 0; }
            .splash-loading { margin-top: 22px; }
        }

        .app-header {
            min-height: var(--header-height); display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(17, 17, 17, 0.06);
            box-shadow: 0 4px 18px rgba(17, 17, 17, 0.03);
            flex-shrink: 0; padding-top: max(0px, env(safe-area-inset-top)); z-index: 10;
        }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .header-logo { display: flex; align-items: center; gap: 10px; }
        .header-logo svg { width: 24px; height: 24px; fill: var(--primary); }
        .header-logo h1 { font-size: 1.35rem; font-weight: 900; font-style: italic; letter-spacing: -0.06em; color: #101010; }
        
        #main-content {
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px;
            padding-bottom: calc(var(--nav-height) + 20px + env(safe-area-inset-bottom));
            -webkit-overflow-scrolling: touch;
        }

        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0; min-height: var(--nav-height);
            background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(18px);
            border-top: 1px solid rgba(17, 17, 17, 0.06); display: flex;
            justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 100;
            box-shadow: 0 -8px 20px rgba(17, 17, 17, 0.04);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 0.7rem; font-weight: 700; gap: 4px; cursor: pointer;
            transition: color 0.2s ease, transform 0.2s ease, background 0.25s ease, box-shadow 0.25s ease;
            width: 25%; min-height: 58px; border: 0; border-radius: 14px; background: transparent;
        }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-item.active {
            color: var(--primary); background: rgba(6, 193, 103, 0.08);
            transform: translateY(-2px); box-shadow: inset 0 0 0 1px rgba(6, 193, 103, 0.14);
        }

        .auth-container {
            display: flex; flex-direction: column; justify-content: center; min-height: 100%;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
            z-index: 50; background: linear-gradient(180deg, #f8f9f9 0%, #eef3f0 100%);
            position: fixed; inset: 0; overflow-y: auto;
        }
        #auth-overlay > :is(.auth-tabs, form) { width: min(100%, 480px); margin-left: auto; margin-right: auto; }
        #auth-overlay > .text-center { width: 100%; }
        .auth-tabs {
            display: flex; margin-bottom: 30px; background: rgba(255,255,255,0.8);
            border: 1px solid rgba(17,17,17,0.08); border-radius: var(--radius); padding: 4px;
            box-shadow: 0 8px 16px rgba(17,17,17,0.03);
        }
        .auth-tab {
            flex: 1; padding: 12px; min-height: 46px; text-align: center; color: var(--text-muted);
            cursor: pointer; font-weight: 700; font-size: 0.95rem; border-radius: 12px; transition: 0.25s ease; background: transparent; box-shadow: none;
        }
        .auth-tab.active {
            background: linear-gradient(180deg, var(--primary) 0%, var(--primary-strong) 100%);
            color: #ffffff; box-shadow: 0 10px 20px rgba(6, 193, 103, 0.18);
        }
        .logo-container {
            width: 92px; height: 92px; margin: 0 auto 12px; border-radius: 28px;
            display: grid; place-items: center; background: linear-gradient(145deg, rgba(6, 193, 103, 0.1), rgba(255,255,255,0.8));
            border: 1px solid rgba(6, 193, 103, 0.22); box-shadow: 0 12px 28px rgba(6, 193, 103, 0.08);
        }
        .logo-text {
            font-size: 2.2rem; font-weight: 900; font-style: italic; letter-spacing: -0.08em; color: var(--primary);
        }
        .form-group { margin-bottom: 20px; }

        #toast-container { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 10px; width: min(90%, 400px); pointer-events: none; }
        .toast {
            background: rgba(17, 17, 17, 0.94); color: white; padding: 16px 20px; border-radius: 16px; font-size: 0.9rem; font-weight: 700; text-align: center;
            box-shadow: 0 18px 38px rgba(17, 17, 17, 0.18); animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), fadeOut 0.4s ease 3.6s forwards;
            border-left: 4px solid var(--primary); backdrop-filter: blur(10px);
        }
        .toast.error { border-left-color: var(--danger); }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }

        #modal-overlay {
            position: fixed; inset: 0; background: rgba(17, 17, 17, 0.32); backdrop-filter: blur(4px);
            z-index: 10001; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.3s, visibility 0.3s;
        }
        #modal-overlay.active { opacity: 1; visibility: visible; pointer-events: all; }
        .modal-box {
            background: #ffffff;
            width: 90%; max-width: 340px; border-radius: 22px; padding: 24px; transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center;
            border: 1px solid rgba(17,17,17,0.08); box-shadow: 0 20px 40px rgba(17, 17, 17, 0.12);
        }
        #modal-overlay.active .modal-box { transform: scale(1); }

        .loader { border: 3px solid rgba(17,17,17,0.08); border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .map-container { width: 100%; height: 180px; border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; border: 1px solid rgba(17,17,17,0.08); background: #e8ecec; }
        .map-container iframe { width: 100%; height: 100%; border: none; filter: grayscale(100%) contrast(110%); }

        .timeline { display: flex; justify-content: space-between; margin: 20px 0; position: relative; padding: 0 10px; }
        .timeline::before { content: ''; position: absolute; top: 12px; left: 30px; right: 30px; height: 2px; background: rgba(17,17,17,0.08); z-index: 1; }
        .timeline-step { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .timeline-dot { width: 24px; height: 24px; border-radius: 50%; background: #e6e8eb; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); transition: 0.3s; }
        .timeline-dot.active { background: var(--primary); box-shadow: 0 0 15px rgba(6, 193, 103, 0.25); }
        .timeline-dot svg { width: 12px; height: 12px; fill: #fff; }
        .timeline-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .timeline-step.active .timeline-label { color: var(--primary); }
        .text-xs { font-size: 0.75rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 1rem; }
        .empty-state {
            padding: 28px 18px; border: 1px dashed rgba(17,17,17,0.12); border-radius: var(--radius); color: var(--text-muted); text-align: center;
            background: rgba(255,255,255,0.45);
        }
        .status-message { overflow-wrap: anywhere; }
        .profile-card { width: min(100%, 720px); margin-inline: auto; }
        .profile-card .profile-info { min-width: 0; overflow-wrap: anywhere; }
        .chat-panel { margin-top: 16px; }
        .chat-messages {
            display: flex; flex-direction: column; gap: 10px; max-height: 280px; min-height: 90px; overflow-y: auto; padding: 12px; background: #f5f6f7;
            border: 1px solid rgba(17,17,17,0.06); border-radius: 14px;
        }
        .chat-message {
            max-width: 88%; align-self: flex-start; padding: 10px 12px; border-radius: 14px 14px 14px 4px; background: #ffffff; overflow-wrap: anywhere;
            border: 1px solid rgba(17,17,17,0.05);
        }
        .chat-message.mine { align-self: flex-end; background: rgba(6, 193, 103, 0.08); border: 1px solid rgba(6, 193, 103, 0.12); border-radius: 14px 14px 4px 14px; }
        .chat-message-meta { display: flex; gap: 8px; margin-bottom: 4px; color: var(--text-muted); font-size: 0.7rem; }
        .chat-compose { display: flex; gap: 8px; margin-top: 10px; align-items: stretch; }
        .chat-compose input { min-width: 0; }
        .fare-box { border: 1px solid rgba(6, 193, 103, 0.18); background: rgba(6, 193, 103, 0.05); border-radius: 14px; padding: 14px; margin: 12px 0; }
        .fare-amount { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
        .map-container iframe { display: block; }
        #link-forgot { min-height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        :root {
            --primary: #111111;
            --primary-strong: #000000;
            --radius: 14px;
            --shadow-soft: 0 8px 24px rgba(17, 17, 17, 0.07);
        }
        body {
            background: #f6f6f6;
            color: #111111;
        }
        button { border-radius: 12px; }
        .btn-primary {
            background: #111111;
            color: #ffffff;
            box-shadow: none;
        }
        .btn-primary:hover:not(:disabled) {
            background: #333333;
            box-shadow: none;
        }
        .btn-outline {
            background: #ffffff;
            color: #111111;
            border-color: #d8d8d8;
        }
        .btn-danger {
            background: #ffffff;
            color: #c0392b;
            border-color: #e8c9c6;
        }
        input, select, textarea {
            border-radius: 10px;
            box-shadow: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #111111;
            box-shadow: 0 0 0 2px rgba(17, 17, 17, 0.12);
        }
        label {
            color: #3f3f3f;
            letter-spacing: 0.035em;
        }
        .card {
            border-color: #e8e8e8;
            box-shadow: var(--shadow-soft);
        }
        .badge-requested, .badge-in_progress {
            color: #111111;
            background: #f1f1f1;
        }
        .badge-accepted { color: #16834b; background: #e8f5ed; }
        .badge-arrived { color: #245f9e; background: #eaf2fb; }
        .app-header {
            background: rgba(255, 255, 255, 0.96);
            box-shadow: none;
            border-bottom-color: #e9e9e9;
        }
        .header-logo svg { fill: #111111; filter: none; }
        .bottom-nav {
            background: rgba(255, 255, 255, 0.98);
            border-top-color: #e8e8e8;
            box-shadow: 0 -4px 16px rgba(17, 17, 17, 0.04);
        }
        .nav-item.active {
            color: #111111;
            background: #f1f1f1;
            box-shadow: none;
        }
        .auth-container {
            background: #f6f6f6;
        }
        .auth-tabs {
            background: #eeeeee;
            border-color: #eeeeee;
            box-shadow: none;
        }
        .auth-tab.active {
            color: #ffffff;
            background: #111111;
            box-shadow: none;
        }
        .logo-container {
            background: #111111;
            border-color: #111111;
            box-shadow: none;
        }
        .logo-text { color: #ffffff; text-shadow: none; }
        .splash-wordmark { color: #111111; text-shadow: none; }
        .splash-emblem {
            background: #ffffff;
            border-color: #e5e5e5;
            box-shadow: 0 12px 32px rgba(17, 17, 17, 0.08);
        }
        .splash-emblem::before, .splash-emblem::after { border-color: #e8e8e8; }
        .splash-logo { filter: grayscale(1); }
        .splash-loading::before { background: #111111; }
        .timeline-dot.active {
            background: #111111;
            box-shadow: none;
        }
        .timeline-dot svg { fill: #ffffff; }
        .timeline-step.active .timeline-label, .text-primary, .fare-amount { color: #111111; }
        .fare-box {
            border-color: #e5e5e5;
            background: #f8f8f8;
        }
        .empty-state {
            background: #ffffff;
            border-color: #d9d9d9;
        }
        .map-container iframe { filter: grayscale(100%) contrast(105%); }
        .chat-message.mine {
            color: #ffffff;
            background: #222222;
            border-color: #222222;
        }
        .toast { border-left-color: #111111; }
        .form-group { margin-bottom: 18px; }
        label {
            color: #333333;
            font-size: 0.88rem;
            font-weight: 600;
            text-transform: none;
            letter-spacing: 0;
            margin-bottom: 7px;
        }
        input, select, textarea {
            min-height: 54px;
            padding: 15px 16px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: #f3f3f3;
            color: #111111;
            font-size: 1rem;
            box-shadow: none;
        }
        input:hover, select:hover, textarea:hover { background: #eeeeee; }
        input:focus, select:focus, textarea:focus {
            border-color: #777777;
            background: #ffffff;
            box-shadow: 0 0 0 1px #777777;
        }
        input::placeholder, textarea::placeholder { color: #777777; }
        textarea { min-height: 96px; }
        form.card {
            padding: 22px;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid #e8e8e8;
            box-shadow: 0 6px 20px rgba(17, 17, 17, 0.045);
        }
        #auth-overlay {
            align-items: center;
            justify-content: center;
            gap: 0;
            padding-left: 24px;
            padding-right: 24px;
        }

        <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation">

                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>

                <span>Profile</span>

    </div>

    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const fetchWithTimeout = async (input, init = {}) => {
            const controller = new AbortController();
            const abortFromCaller = () => controller.abort();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            if (init.signal?.aborted) abortFromCaller();
            else init.signal?.addEventListener('abort', abortFromCaller, { once: true });
            try {
                return await fetch(input, { ...init, signal: controller.signal });
            } finally {
                clearTimeout(timeoutId);
                init.signal?.removeEventListener('abort', abortFromCaller);
            }
        };

        const supabase = createClient(
            "https://hzxdasxebvcunbtecbio.supabase.co",
            "sb_publishable_J-cORO6pStpYcJWBuOPjvQ_zR1nU5PK",
            { global: { fetch: fetchWithTimeout } }
        );
        const passwordRecoveryRedirectUrl = () =>
            ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname)
                ? 'https://mrsadityathakur.github.io/Flash/'
                : `${window.location.origin}${window.location.pathname}`;

        let currentUser = null;
        let userProfile = null;
        let currentMode = 'customer';
        let activeRideId = null;
        let listeners = [];
        let availableRidesUnsub = null;
        let chatUnsub = null;
        let chatRideId = null;
        let modalReturnFocus = null;
        let selectedAuthRole = 'customer';
        let requestedLoginRole = null;
        let authStateUserId = undefined;
        
        const appEl = document.getElementById('app');
        const splashEl = document.getElementById('splash-screen');
        const mainContent = document.getElementById('main-content');
        const bottomNav = document.getElementById('bottom-nav');
        const headerTitle = document.getElementById('header-title');
        const btnExitDriver = document.getElementById('btn-exit-driver');
        const btnDriverAccount = document.getElementById('btn-driver-account');

        function mapRide(row) {
            return {
                ...row,
                customerUid: row.customer_id,
                customerName: row.customer_name,
                driverUid: row.driver_id,
                driverName: row.driver_name,
                driverPhone: row.driver_phone,
                rideType: row.ride_type,
                createdAt: row.created_at,
                acceptedAt: row.accepted_at,
                arrivedAt: row.arrived_at,
                startedAt: row.started_at,
                completedAt: row.completed_at,
                cancelledAt: row.cancelled_at,
                releasedAt: row.released_at,
                fareQuote: row.fare_quote,
                fareStatus: row.fare_status,
                fareOfferedAt: row.fare_offered_at,
                fareRespondedAt: row.fare_responded_at
            };
        }

        function mapMessage(row) {
            return {
                ...row,
                senderUid: row.sender_id,
                senderName: row.sender_name,
                createdAt: row.created_at
            };
        }

        function watchRows(table, filters, orderColumn, rowLimit, onRows, onError) {
            let stopped = false;
            const load = async () => {
                try {
                    const request = supabase.from(table).select('*');
                    filters.forEach(([column, value]) => request.eq(column, value));
                    if (orderColumn) request.order(orderColumn, { ascending: false });
                    if (rowLimit) request.limit(rowLimit);
                    const { data, error } = await request;
                    if (stopped) return;
                    if (error) {
                        onError(error);
                        return;
                    }
                    onRows(data || []);
                } catch (error) {
                    if (!stopped) onError(error);
                }
            };
            const channel = supabase
                .channel(`flash-${table}-${crypto.randomUUID()}`)
                .on('postgres_changes', { event: '*', schema: 'public', table }, () => { void load(); })
                .subscribe(status => {
                    if (status === 'SUBSCRIBED') void load();
                    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        onError(new Error(`Realtime connection failed for ${table}.`));
                    }
                });
            void load();
            return () => {
                stopped = true;
                void supabase.removeChannel(channel);
            };
        }

        document.addEventListener('keydown', event => {
            const overlay = document.getElementById('modal-overlay');
            if (!overlay.classList.contains('active')) return;
            if (event.key === 'Escape') {
                event.preventDefault();
                closeModal();
            } else if (event.key === 'Tab') {
                const focusable = [...overlay.querySelectorAll('button:not(:disabled)')];
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                    event.preventDefault();
                    first.focus();
                }
            }
        });

        // --- UTILS ---
        function playSound(type) {
            let ctx;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if(type === 'success') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); 
                } else { osc.frequency.setValueAtTime(440, ctx.currentTime); }
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.onended = () => ctx.close();
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } catch (error) {
                if (ctx && ctx.state !== 'closed') ctx.close().catch(() => {});
            }
        }

        function showModal(title, desc, onConfirm) {
            const overlay = document.getElementById('modal-overlay');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            modalReturnFocus = document.activeElement;
            overlay.classList.add('active');
            overlay.removeAttribute('inert');
            overlay.setAttribute('aria-hidden', 'false');
            document.getElementById('modal-cancel').focus();
            document.getElementById('modal-confirm').onclick = async () => {
                closeModal();
                try { await onConfirm(); }
                catch (error) { showToast(getErrorMessage(error), true); }
            };
            document.getElementById('modal-cancel').onclick = closeModal;
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            overlay.classList.remove('active');
            overlay.setAttribute('aria-hidden', 'true');
            overlay.setAttribute('inert', '');
            if (modalReturnFocus instanceof HTMLElement && modalReturnFocus.isConnected) modalReturnFocus.focus();
        }

        function showToast(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.textContent = msg;
            container.appendChild(toast);
            playSound(isError ? 'alert' : 'success');
            setTimeout(() => toast.remove(), msg.length > 120 ? 10000 : 4000);
        }

        function setLoading(btn, isLoading) {
            if (!btn) return;
            if (isLoading) {
                if (!btn.disabled) btn.dataset.originalText = btn.textContent;
                btn.textContent = 'Please wait…';
                btn.setAttribute('aria-busy', 'true');
                btn.disabled = true;
            } else {
                btn.textContent = btn.dataset.originalText || btn.textContent;
                btn.removeAttribute('aria-busy');
                btn.disabled = false;
            }
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }

        function getErrorMessage(error) {
            if (error?.code === 'P0001' || error?.code === '42501') {
                return error.message || 'Finish or cancel your active ride before switching modes.';
            }
            const message = error?.message || 'Something went wrong. Please try again.';
            const errorCode = String(error?.code || error?.error_code || '').toLowerCase();
            if (errorCode === 'over_email_send_rate_limit' || /email.{0,30}rate.?limit|rate.?limit.{0,30}email/i.test(message)) {
                return 'Supabase temporarily blocked auth emails because the email limit was reached. Please stop retrying and try again later. To prevent this, configure a custom SMTP provider or review Authentication → Rate Limits in your Supabase Dashboard. If you already have an account, use Login instead of Sign Up.';
            }
            return message.replace(/^(AuthApiError|PostgrestError):\s*/i, '');
        }

        function cleanupListeners() {
            listeners.forEach(unsub => unsub());
            listeners = [];
            if (availableRidesUnsub) {
                availableRidesUnsub();
                availableRidesUnsub = null;
            }
            if (chatUnsub) {
                chatUnsub();
                chatUnsub = null;
                chatRideId = null;
            }
        }

        function formatDate(ts) {
            if (!ts) return 'N/A';
            const date = typeof ts.toDate === 'function' ? ts.toDate() : new Date(ts);
            return Number.isNaN(date.getTime()) ? 'N/A' : date.toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
        }

        function displayStatus(status) {
            return escapeHTML(String(status || 'unknown').replace(/_/g, ' '));
        }

        function formatINR(amount) {
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                maximumFractionDigits: 0
            }).format(amount);
        }

        function renderFare(ride, viewer) {
            if (!Number.isSafeInteger(ride.fareQuote) || ride.fareQuote < 1) {
                return viewer === 'driver'
                    ? `<div class="fare-box"><p class="font-bold">No fare proposed yet</p><p class="text-sm text-muted">Send your price to the customer. No automatic distance estimate is used.</p></div>`
                    : `<div class="fare-box"><p class="font-bold">Fare not set yet</p><p class="text-sm text-muted">The driver will send a price for you to confirm.</p></div>`;
            }
            const state = ride.fareStatus === 'accepted' ? 'Agreed' : ride.fareStatus === 'declined' ? 'Declined — waiting for a new quote' : 'Waiting for customer confirmation';
            const buttons = viewer === 'customer' && ride.fareStatus === 'offered'
                ? `<div class="flex gap-2 mt-2"><button type="button" class="btn-primary w-full" id="btn-accept-fare">Accept fare</button><button type="button" class="btn-outline w-full" id="btn-decline-fare">Decline</button></div>`
                : '';
            return `<div class="fare-box"><p class="text-sm text-muted">DRIVER'S PRICE · INR</p><p class="fare-amount">${formatINR(ride.fareQuote)}</p><p class="text-sm text-muted">${state}. This is a direct fare agreement, not a payment receipt.</p>${buttons}</div>`;
        }

        function setupRideChat(rideId) {
            const panel = document.getElementById('ride-chat');
            if (!panel) {
                if (chatUnsub) chatUnsub();
                chatUnsub = null;
                chatRideId = null;
                return;
            }
            if (chatRideId !== rideId) {
                if (chatUnsub) chatUnsub();
                chatRideId = rideId;
                const unsubscribe = watchRows('ride_messages', [['ride_id', rideId]], 'created_at', 100, rows => {
                const messages = document.getElementById('chat-messages');
                if (!messages) return;
                if (!rows.length) {
                    messages.innerHTML = `<p class="text-sm text-muted">No messages yet. Send a message to coordinate pickup.</p>`;
                } else {
                    messages.innerHTML = rows.slice().reverse().map(row => {
                        const message = mapMessage(row);
                        const ownMessage = message.senderUid === currentUser.uid;
                        return `<div class="chat-message ${ownMessage ? 'mine' : ''}"><div class="chat-message-meta"><strong>${escapeHTML(ownMessage ? 'You' : message.senderName || 'Ride participant')}</strong><time>${escapeHTML(formatDate(message.createdAt))}</time></div><p>${escapeHTML(message.text || '')}</p></div>`;
                    }).join('');
                    messages.scrollTop = messages.scrollHeight;
                }
            }, error => {
                const messages = document.getElementById('chat-messages');
                if (messages) messages.innerHTML = `<p class="text-sm text-danger">Chat unavailable: ${escapeHTML(getErrorMessage(error))}</p>`;
                });
                chatUnsub = unsubscribe;
                listeners.push(() => {
                    unsubscribe();
                    if (chatUnsub === unsubscribe) {
                        chatUnsub = null;
                        chatRideId = null;
                    }
                });
            }
            const form = document.getElementById('form-chat');
            if (form) form.onsubmit = async event => {
                event.preventDefault();
                const input = document.getElementById('chat-input');
                const button = document.getElementById('btn-send-chat');
                const text = input.value.trim();
                if (!text || text.length > 1000) {
                    showToast('Messages must contain 1–1000 characters.', true);
                    return;
                }
                setLoading(button, true);
                try {
                    const { error } = await supabase.from('ride_messages').insert({
                        ride_id: rideId,
                        sender_id: currentUser.uid,
                        sender_name: userProfile.name,
                        text,
                    });
                    if (error) throw error;
                    input.value = '';
                } catch (error) {
                    showToast(`Message not sent: ${getErrorMessage(error)}`, true);
                } finally {
                    setLoading(button, false);
                }
            };
        }

        async function respondToFare(rideId, accept, button) {
            setLoading(button, true);
            try {
                const { error } = await supabase.rpc('respond_to_ride_fare', {
                    p_ride_id: rideId,
                    p_accept: accept
                });
                if (error) throw error;
                showToast(accept ? 'Fare accepted.' : 'Fare declined. The driver can send a new quote.');
            } catch (error) {
                showToast(getErrorMessage(error), true);
                setLoading(button, false);
            }
        }

        // --- AUTH ---
        function renderAuth() {
            cleanupListeners(); 
            appEl.classList.add('hidden'); splashEl.classList.add('hidden');
            
            let authOverlay = document.getElementById('auth-overlay');
            if (!authOverlay) {
                authOverlay = document.createElement('div'); authOverlay.id = 'auth-overlay'; authOverlay.className = 'auth-container'; document.body.appendChild(authOverlay);
            }
            authOverlay.classList.remove('hidden');
            
            authOverlay.innerHTML = `

                <p class="text-center text-muted mb-1">Sign in to book or manage rides</p>
                <div class="auth-tabs" id="auth-role-tabs" role="tablist" aria-label="Account role">

                    <button type="button" class="auth-tab" id="tab-driver-role" role="tab" aria-selected="false">Rider</button>

                <div class="auth-tabs" role="tablist" aria-label="Account access">

                    <button type="button" class="auth-tab" id="tab-signup" role="tab" aria-selected="false" aria-controls="form-signup">Sign Up</button>
                </div>
                <h2 class="text-center mb-2" id="auth-role-title">Customer account</h2>
                <form id="form-login">
                    <div class="form-group"><label for="login-email" id="login-email-label">Customer email</label><input type="email" id="login-email" name="email" autocomplete="email" required placeholder="you@example.com"></div>
                    <div class="form-group"><label for="login-password">Password</label><input type="password" id="login-password" name="password" autocomplete="current-password" required placeholder="••••••••"></div>
                    <button type="submit" class="btn-primary w-full mt-2" id="btn-login">Customer Login</button>
                    <button type="button" class="text-center mt-3 text-sm text-muted" id="link-forgot" style="background:transparent; border:0; width:100%; font-weight:600;">Forgot Password?</button>
                </form>
                <form id="form-signup" class="hidden" aria-hidden="true">
                    <div class="form-group"><label for="signup-name">Full name (optional)</label><input type="text" id="signup-name" name="name" autocomplete="name" maxlength="80" placeholder="Your name"></div>
                    <div class="form-group"><label for="signup-phone">Phone number (optional)</label><input type="tel" id="signup-phone" name="phone" autocomplete="tel" maxlength="30" placeholder="+1 555 123 4567"></div>
                    <div class="form-group"><label for="signup-email">Email</label><input type="email" id="signup-email" name="email" autocomplete="email" required placeholder="you@example.com"></div>
                    <div class="form-group"><label for="signup-password">Password (min 6 chars)</label><input type="password" id="signup-password" name="password" autocomplete="new-password" required minlength="6" placeholder="••••••••"></div>
                    <p class="text-sm text-muted">New accounts start as customers. FLASH creates your ride PIN automatically. Phone is optional.</p>
                    <button type="submit" class="btn-primary w-full mt-2" id="btn-signup">Create customer account</button>
                </form>
            `;

            const selectAuthRole = role => {
                selectedAuthRole = role;
                const isDriver = role === 'driver';
                document.getElementById('tab-customer-role').classList.toggle('active', !isDriver);
                document.getElementById('tab-customer-role').setAttribute('aria-selected', String(!isDriver));
                document.getElementById('tab-driver-role').classList.toggle('active', isDriver);
                document.getElementById('tab-driver-role').setAttribute('aria-selected', String(isDriver));
                document.getElementById('auth-role-title').textContent = `${isDriver ? 'Rider' : 'Customer'} account`;
                document.getElementById('login-email-label').textContent = `${isDriver ? 'Rider' : 'Customer'} email`;
                document.getElementById('btn-login').textContent = `${isDriver ? 'Rider' : 'Customer'} Login`;
                document.getElementById('btn-signup').textContent = 'Create customer account';
            };
            document.getElementById('tab-customer-role').onclick = () => selectAuthRole('customer');
            document.getElementById('tab-driver-role').onclick = () => selectAuthRole('driver');

            const selectAuthTab = showSignup => {
                document.getElementById('tab-login').classList.toggle('active', !showSignup);
                document.getElementById('tab-login').setAttribute('aria-selected', String(!showSignup));
                document.getElementById('tab-signup').classList.toggle('active', showSignup);
                document.getElementById('tab-signup').setAttribute('aria-selected', String(showSignup));
                document.getElementById('form-login').classList.toggle('hidden', showSignup);
                document.getElementById('form-login').setAttribute('aria-hidden', String(showSignup));
                document.getElementById('form-signup').classList.toggle('hidden', !showSignup);
                document.getElementById('form-signup').setAttribute('aria-hidden', String(!showSignup));
                document.getElementById('auth-role-tabs').classList.toggle('hidden', showSignup);
                document.getElementById('auth-role-tabs').setAttribute('aria-hidden', String(showSignup));
                document.getElementById('auth-role-title').textContent = showSignup ? 'Create a customer account' : `${selectedAuthRole === 'driver' ? 'Rider' : 'Customer'} account`;
            };
            document.getElementById('tab-login').onclick = () => selectAuthTab(false);
            document.getElementById('tab-signup').onclick = () => selectAuthTab(true);

            document.getElementById('form-login').onsubmit = async (e) => {
                e.preventDefault(); const btn = document.getElementById('btn-login'); setLoading(btn, true);
                requestedLoginRole = selectedAuthRole;
                try {
                    const { error } = await supabase.auth.signInWithPassword({
                        email: document.getElementById('login-email').value.trim(),
                        password: document.getElementById('login-password').value
                    });
                    if (error) throw error;
                }
                catch (error) {
                    requestedLoginRole = null;
                    showToast(getErrorMessage(error), true);
                } finally { setLoading(btn, false); }
            };

            document.getElementById('form-signup').onsubmit = async (e) => {
                e.preventDefault(); const btn = document.getElementById('btn-signup'); setLoading(btn, true);
                try {
                    const name = document.getElementById('signup-name').value.trim();
                    const phone = document.getElementById('signup-phone').value.trim();
                    const email = document.getElementById('signup-email').value.trim();
                    const { data, error } = await supabase.auth.signUp({
                        email,
                        password: document.getElementById('signup-password').value,
                        options: {
                            data: { name, phone }
                        }
                    });
                    if (error) throw error;
                    showToast(data.session
                        ? 'Your FLASH customer account is ready.'
                        : `Check ${email} to confirm your customer account.`);
                } catch (error) {
                    showToast(getErrorMessage(error), true);
                } finally {
                    setLoading(btn, false);
                }
            };

            document.getElementById('link-forgot').onclick = async () => {
                const email = document.getElementById('login-email').value; if (!email) return showToast("Enter your email first", true);
                try {
                    const { error } = await supabase.auth.resetPasswordForEmail(email.trim(), {
                        redirectTo: passwordRecoveryRedirectUrl()
                    });
                    if (error) throw error;
                    showToast("Password reset link sent.");
                } catch (error) { showToast(getErrorMessage(error), true); }
            };
        }

        function renderPasswordRecovery() {
            let authOverlay = document.getElementById('auth-overlay');
            if (!authOverlay) {
                authOverlay = document.createElement('div');
                authOverlay.id = 'auth-overlay';
                authOverlay.className = 'auth-container';
                document.body.appendChild(authOverlay);
            }
            authOverlay.classList.remove('hidden');
            authOverlay.innerHTML = `
                <div class="w-full" style="max-width: 480px; margin: auto;">
                    <h2 class="font-bold text-lg mb-1">Set a new password</h2>
                    <p class="text-muted text-sm mb-2">Choose a new password for your FLASH account.</p>
                    <form id="form-password-recovery" class="card">
                        <div class="form-group">
                            <label for="recovery-password">New password</label>
                            <input id="recovery-password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters">
                        </div>
                        <div class="form-group">
                            <label for="recovery-password-confirm">Confirm new password</label>
                            <input id="recovery-password-confirm" type="password" autocomplete="new-password" minlength="6" required placeholder="Enter the password again">
                        </div>
                        <button type="submit" class="btn-primary w-full" id="btn-save-recovery-password">Update password</button>
                    </form>
                </div>
            `;
            document.getElementById('form-password-recovery').onsubmit = async event => {
                event.preventDefault();
                const password = document.getElementById('recovery-password').value;
                const confirmation = document.getElementById('recovery-password-confirm').value;
                const button = document.getElementById('btn-save-recovery-password');
                if (password.length < 6) {
                    showToast('Password must be at least 6 characters.', true);
                    return;
                }
                if (password !== confirmation) {
                    showToast('Passwords do not match.', true);
                    return;
                }
                setLoading(button, true);
                try {
                    const { error } = await supabase.auth.updateUser({ password });
                    if (error) throw error;
                    authOverlay.remove();
                    showToast('Password updated successfully.');
                } catch (error) {
                    showToast(`Could not update password: ${getErrorMessage(error)}`, true);
                } finally {
                    setLoading(button, false);
                }
            };
        }

        async function handleAuthStateChange(user) {
            const nextUserId = user?.id || null;
            if (authStateUserId === nextUserId) return;
            authStateUserId = nextUserId;
            const authOverlay = document.getElementById('auth-overlay');
            if (user) {
                currentUser = { ...user, uid: user.id };
                try {
                    const { data: profile, error } = await supabase
                        .from('profiles')
                        .select('id,name,email,phone,role')
                        .eq('id', user.id)
                        .single();
                    if (error) throw error;
                    userProfile = { ...profile, uid: profile.id };
                    const { data: hasRidePin, error: pinError } = await supabase.rpc('has_customer_pin');
                    if (pinError) throw pinError;
                    userProfile.hasRidePin = hasRidePin;
                    if (requestedLoginRole && requestedLoginRole !== userProfile.role) {
                        requestedLoginRole = null;
                        await supabase.auth.signOut();
                        showToast(`This email belongs to a ${userProfile.role} account. Choose ${userProfile.role} login instead.`, true);
                        return;
                    }
                    requestedLoginRole = null;
                    if (authOverlay) authOverlay.remove();
                    splashEl.classList.add('hidden'); appEl.classList.remove('hidden'); switchMode(userProfile.role);
                    if (userProfile.role === 'customer' && !userProfile.hasRidePin) {
                        bottomNav.querySelector('[data-view="profile"]').click();
                        showToast('Set your six-digit ride PIN in Profile before booking.');
                    }
                } catch (error) {
                    showToast(`Could not load your Supabase profile: ${getErrorMessage(error)}`, true);
                    await supabase.auth.signOut();
                }
            } else {
                currentUser = null; userProfile = null; activeRideId = null;
                cleanupListeners(); appEl.classList.add('hidden'); renderAuth();
            }
        }

        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                setTimeout(async () => {
                    if (session?.user) await handleAuthStateChange(session.user);
                    renderPasswordRecovery();
                }, 0);
                return;
            }
            if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'SIGNED_OUT') {
                setTimeout(() => { void handleAuthStateChange(session?.user || null); }, 0);
            }
        });

        function switchMode(mode) {
            if (mode !== 'customer' && mode !== 'driver') {
                showToast('That app mode is unavailable.', true);
                return;
            }
            if (userProfile?.role !== mode) {
                showToast(`Switch your account to ${mode} mode first.`, true);
                return;
            }
            currentMode = mode; activeRideId = null; cleanupListeners();
            if (mode === 'customer') { headerTitle.innerText = "FLASH"; btnExitDriver.style.display = 'none'; btnDriverAccount.style.display = 'none'; bottomNav.style.display = 'flex'; renderCustomerHome(); }
            else { headerTitle.innerText = "Rider Dashboard"; btnExitDriver.style.display = 'block'; btnDriverAccount.style.display = 'block'; bottomNav.style.display = 'none'; renderDriverDashboard(); }
        }

        async function changeUserRole(role, button) {
            if (role !== 'customer' && role !== 'driver') return;
            if (role === 'customer' && !userProfile.hasRidePin) {
                renderProfile();
                showToast('Set your six-digit ride PIN in Profile before switching to customer mode.', true);
                return;
            }
            if (userProfile?.role === role) {
                switchMode(role);
                return;
            }

            setLoading(button, true);
            try {
                const { error } = await supabase.rpc('switch_user_role', { p_role: role });
                if (error) throw error;
                userProfile.role = role;
                showToast(role === 'driver' ? 'Rider mode is ready.' : 'Switched to customer mode.');
                switchMode(role);
            } catch (error) {
                showToast(getErrorMessage(error), true);
                setLoading(button, false);
            }
        }

        btnExitDriver.onclick = () => changeUserRole('customer', btnExitDriver);
        btnDriverAccount.onclick = renderProfile;

        bottomNav.onclick = (e) => {
            const navItem = e.target.closest('.nav-item'); if (!navItem) return;
            bottomNav.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
                el.removeAttribute('aria-current');
            });
            navItem.classList.add('active');
            navItem.setAttribute('aria-current', 'page');
            if (navItem.dataset.view === 'home') renderCustomerHome();
            if (navItem.dataset.view === 'active') renderActiveRide();
            if (navItem.dataset.view === 'history') renderRideHistory();
            if (navItem.dataset.view === 'profile') renderProfile();
        };

        // --- CUSTOMER ---
        function renderCustomerHome() {
            cleanupListeners(); bottomNav.style.display = 'flex';
            bottomNav.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            bottomNav.querySelector('[data-view="home"]').classList.add('active');
            bottomNav.querySelectorAll('.nav-item').forEach(el => el.removeAttribute('aria-current'));
            bottomNav.querySelector('[data-view="home"]').setAttribute('aria-current', 'page');

            mainContent.innerHTML = `
                <div class="mb-2"><h2 class="font-bold text-lg">Hey, ${escapeHTML(userProfile.name.split(' ')[0])}!</h2><p class="text-muted text-sm">Ready to flash to your destination?</p></div>
                <div class="card">
                    <form id="form-book-ride">
                        <div class="form-group"><label for="pickup">Pickup Location</label><input type="text" id="pickup" name="pickup" maxlength="160" autocomplete="street-address" required placeholder="Enter pickup address"></div>
                        <div class="form-group"><label for="destination">Where to?</label><input type="text" id="destination" name="destination" maxlength="160" required placeholder="Enter destination"></div>
                        <div class="form-group"><label for="contact-phone">Contact number (optional)</label><input type="tel" id="contact-phone" name="phone" maxlength="30" autocomplete="tel" value="${escapeHTML(userProfile.phone || '')}"></div>
                        <div class="form-group"><label for="ride-type">Vehicle Type</label><select id="ride-type" name="rideType"><option value="bike">Bike (Fastest)</option></select></div>
                        <div class="form-group"><label for="instructions">Note for Driver (Optional)</label><textarea id="instructions" name="instructions" maxlength="300" rows="2" placeholder="e.g. I'm at the main gate"></textarea></div>
                        <button type="submit" class="btn-primary w-full mt-2" id="btn-book">Confirm Booking</button>
                    </form>
                </div>
            `;
            let pendingRideId = null;
            document.getElementById('form-book-ride').onsubmit = async (e) => {
                e.preventDefault(); const btn = document.getElementById('btn-book'); setLoading(btn, true);
                try {
                    const pickup = document.getElementById('pickup').value.trim();
                    const destination = document.getElementById('destination').value.trim();
                    const phone = document.getElementById('contact-phone').value.trim();
                    const instructions = document.getElementById('instructions').value.trim();
                    if (!userProfile.hasRidePin) {
                        bottomNav.querySelector('[data-view="profile"]').click();
                        throw new Error('Set your six-digit ride PIN in Profile before booking.');
                    }
                    if (!pickup || !destination) throw new Error('Enter your pickup location and destination.');
                    if (pickup.length > 160 || destination.length > 160 || phone.length > 30 || instructions.length > 300) {
                        throw new Error('One or more fields are longer than allowed.');
                    }
                    if (!pendingRideId) pendingRideId = crypto.randomUUID();
                    const rideType = document.getElementById('ride-type').value;
                    const { error } = await supabase.rpc('create_ride', {
                        p_id: pendingRideId,
                        p_phone: phone,
                        p_pickup: pickup,
                        p_destination: destination,
                        p_instructions: instructions,
                        p_ride_type: rideType
                    });
                    if (error) throw error;
                    pendingRideId = null;
                    showToast("Ride requested!");
                    bottomNav.querySelector('[data-view="active"]').click();
                } catch (error) {
                    showToast(`Failed: ${getErrorMessage(error)}`, true);
                    setLoading(btn, false);
                }
            };
        }

        function renderTimeline(status) {
            const steps = ['requested', 'accepted', 'arrived', 'in_progress'];
            let idx = steps.indexOf(status); if(status === 'completed') idx = 4;
            return `
            <div class="timeline">
                ${steps.map((s, i) => `
                    <div class="timeline-step ${i <= idx ? 'active' : ''}">
                        <div class="timeline-dot ${i <= idx ? 'active' : ''}">${i <= idx ? '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' : ''}</div>
                        <span class="timeline-label">${s.replace('_',' ')}</span>
                    </div>
                `).join('')}
            </div>`;
        }

        function renderActiveRide() {
            cleanupListeners();
            mainContent.innerHTML = `<div class="text-center mt-3"><div class="loader" style="margin: 0 auto;"></div></div>`;
            const unsub = watchRows('rides', [['customer_id', currentUser.uid]], 'created_at', null, rows => {
                const activeRide = rows.map(mapRide).find(ride => ['requested', 'accepted', 'arrived', 'in_progress'].includes(ride.status));
                if (!activeRide) {
                    mainContent.innerHTML = `<div class="empty-state mt-3"><p>No active rides right now.</p><button type="button" class="btn-primary mt-2" id="btn-book-from-empty">Book a Ride</button></div>`;
                    document.getElementById('btn-book-from-empty').onclick = () => bottomNav.querySelector('[data-view="home"]').click();
                    return;
                }
                activeRideId = activeRide.id;
                const ride = activeRide;
                
                let driverInfo = '';
                if (['accepted', 'arrived', 'in_progress'].includes(ride.status)) {
                    const driverPhone = String(ride.driverPhone || '');
                    const phoneLink = /^[+0-9() .-]{5,30}$/.test(driverPhone)
                        ? `<a class="btn-outline btn-sm" href="tel:${encodeURIComponent(driverPhone)}">Call driver</a><a class="btn-outline btn-sm" href="https://wa.me/${driverPhone.replace(/\D/g, '')}?text=${encodeURIComponent(`FLASH ride: ${ride.pickup} to ${ride.destination}`)}" target="_blank" rel="noopener noreferrer">WhatsApp</a>`
                        : '';
                    driverInfo = `<div class="card mt-2" style="border-color: var(--primary); background: rgba(255,215,0,0.05);"><h3 class="font-bold mb-1 text-primary">Driver Details</h3><p>Name: ${escapeHTML(ride.driverName || 'Driver')}</p><p>Phone: ${escapeHTML(driverPhone || 'Not provided')}</p>${phoneLink ? `<div class="flex gap-2 mt-2">${phoneLink}</div>` : ''}</div>`;
                }
                const waText = encodeURIComponent(`FLASH Ride:\nFrom: ${ride.pickup}\nTo: ${ride.destination}`);
                const mapEmbed = `<div class="map-container mt-2"><iframe title="Map showing ride pickup" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${encodeURIComponent(ride.pickup)}&output=embed"></iframe></div>`;

                mainContent.innerHTML = `
                    <div class="flex justify-between items-center mb-1"><h2 class="font-bold text-lg">Active Ride</h2><span class="badge badge-${escapeHTML(ride.status)}">${displayStatus(ride.status)}</span></div>
                    ${renderTimeline(ride.status)}
                    ${mapEmbed}
                    <div class="card">
                        <div class="flex flex-col" style="gap: 12px;">
                            <div><p class="text-sm text-muted">Pickup</p><p class="font-bold status-message">${escapeHTML(ride.pickup)}</p></div>

                        </div>
                    </div>
                    ${['accepted', 'arrived', 'in_progress'].includes(ride.status) ? `${renderFare(ride, 'customer')}<section class="card chat-panel" id="ride-chat" aria-label="Chat with your driver"><h3 class="font-bold mb-1">Ride chat</h3><div id="chat-messages" class="chat-messages" aria-live="polite"><p class="text-sm text-muted">Loading messages…</p></div><form id="form-chat" class="chat-compose"><input id="chat-input" type="text" maxlength="1000" autocomplete="off" aria-label="Message to driver" placeholder="Message your driver" required><button type="submit" class="btn-primary btn-sm" id="btn-send-chat">Send</button></form></section>` : ''}
                    ${driverInfo}
                    ${ride.status === 'requested' ? `
                        <div class="flex w-full" style="gap: 10px; margin-top: 16px;">
                            <a href="https://wa.me/?text=${waText}" target="_blank" rel="noopener noreferrer" class="btn-outline w-full" style="text-decoration: none;">WhatsApp</a>
                            <button class="btn-danger w-full" id="btn-cancel-ride">Cancel</button>
                        </div>` : ''}
                `;
                setupRideChat(ride.id);
                const acceptFareButton = document.getElementById('btn-accept-fare');
                if (acceptFareButton) acceptFareButton.onclick = () => respondToFare(ride.id, true, acceptFareButton);
                const declineFareButton = document.getElementById('btn-decline-fare');
                if (declineFareButton) declineFareButton.onclick = () => respondToFare(ride.id, false, declineFareButton);
                const cBtn = document.getElementById('btn-cancel-ride');
                if (cBtn) {
                    cBtn.onclick = () => { 
                        showModal("Cancel Ride?", "Are you sure you want to cancel this ride? It will remain in your ride history.", async () => {
                            setLoading(cBtn, true);
                            try {
                                const { error } = await supabase.rpc('cancel_ride', { p_ride_id: activeRideId });
                                if (error) throw error;
                                showToast("Ride cancelled.");
                            } catch (error) { showToast(getErrorMessage(error), true); setLoading(cBtn, false); }
                        });
                    };
                }
            }, error => showToast(`Unable to load your ride: ${getErrorMessage(error)}`, true));
            listeners.push(unsub);
        }

        function renderRideHistory() {
            cleanupListeners();
            mainContent.innerHTML = `<h2 class="font-bold text-lg mb-2">History</h2><div class="text-center mt-3"><div class="loader" style="margin: 0 auto;"></div></div>`;
            const unsub = watchRows('rides', [['customer_id', currentUser.uid]], 'created_at', null, rows => {
                const history = rows
                    .map(mapRide)
                    .filter(ride => ['completed', 'cancelled'].includes(ride.status))
                    .sort((a, b) => {
                        const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : new Date(a.createdAt || 0).getTime();
                        const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : new Date(b.createdAt || 0).getTime();
                        return timeB - timeA;
                    })
                    .slice(0, 20);
                if (history.length === 0) { mainContent.innerHTML = `<h2 class="font-bold text-lg mb-2">History</h2><div class="empty-state mt-3">Your completed and cancelled rides will appear here.</div>`; return; }
                let html = `<h2 class="font-bold text-lg mb-2">History</h2>`;
                history.forEach(ride => {
                    html += `<div class="card"><div class="flex justify-between mb-1"><span class="badge badge-${ride.status}">${displayStatus(ride.status)}</span><span class="text-xs text-muted">${formatDate(ride.createdAt)}</span></div><p class="text-sm font-bold mt-1 status-message">${escapeHTML(ride.destination || 'Destination unavailable')}</p><p class="text-xs text-muted status-message">From: ${escapeHTML(ride.pickup || 'Pickup unavailable')}</p></div>`;
                });
                mainContent.innerHTML = html;
            }, error => showToast(`Unable to load ride history: ${getErrorMessage(error)}`, true));
            listeners.push(unsub);
        }
