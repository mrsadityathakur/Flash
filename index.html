<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>FLASH - Fast rides. Fair for everyone.</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --surface-light: #222222;
            --primary: #FFD700;
            --primary-dark: #ccac00;
            --text: #ffffff;
            --text-muted: #888888;
            --danger: #ff4444;
            --success: #00C851;
            --radius: 16px;
            --header-height: 60px;
            --nav-height: 70px;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg); color: var(--text); 
            height: 100vh; height: 100dvh;
            overflow: hidden; display: flex; flex-direction: column; user-select: none;
        }

        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .w-full { width: 100%; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }
        .text-primary { color: var(--primary); }
        .text-danger { color: var(--danger); }
        .text-sm { font-size: 0.85rem; }
        .text-lg { font-size: 1.2rem; }
        .font-bold { font-weight: 700; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }

        button {
            font-family: inherit; border: none; border-radius: var(--radius); font-weight: 700;
            font-size: 1rem; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; padding: 16px 20px;
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .btn-primary { background-color: var(--primary); color: #000; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2); }
        .btn-outline { background-color: transparent; border: 1px solid var(--surface-light); color: var(--text); }
        .btn-danger { background-color: rgba(255, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(255, 68, 68, 0.3); }
        .btn-sm { padding: 8px 16px; font-size: 0.85rem; border-radius: 10px; }

        input, select, textarea {
            width: 100%; background-color: var(--surface); border: 1px solid var(--surface-light);
            color: var(--text); padding: 16px; border-radius: var(--radius); font-family: inherit;
            font-size: 1rem; outline: none; transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,215,0,0.1); }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .card { background-color: var(--surface); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; border: 1px solid var(--surface-light); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-requested { background: rgba(255, 215, 0, 0.15); color: var(--primary); }
        .badge-accepted { background: rgba(0, 200, 81, 0.15); color: var(--success); }
        .badge-arrived { background: rgba(0, 150, 255, 0.15); color: #0096FF; }
        .badge-in_progress { background: rgba(255, 215, 0, 0.2); color: var(--primary); }
        .badge-completed { background: rgba(136, 136, 136, 0.2); color: var(--text-muted); }

        #app { display: flex; flex-direction: column; height: 100%; position: relative; }
        
        #splash-screen {
            position: absolute; inset: 0; background-color: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .logo-container { display: flex; flex-direction: column; align-items: center; gap: 12px; animation: pulse 2s infinite; }
        .logo-svg { width: 120px; height: 120px; }
        .logo-text { font-size: 3rem; font-weight: 900; font-style: italic; color: var(--primary); letter-spacing: -2px; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }

        .app-header {
            height: var(--header-height); display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; background-color: var(--bg); border-bottom: 1px solid var(--surface);
            flex-shrink: 0; padding-top: env(safe-area-inset-top); z-index: 10;
        }
        .header-logo { display: flex; align-items: center; gap: 8px; }
        .header-logo svg { width: 28px; height: 28px; fill: var(--primary); }
        .header-logo h1 { font-size: 1.3rem; font-weight: 900; font-style: italic; letter-spacing: -1px;}
        
        #main-content {
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px;
            padding-bottom: calc(var(--nav-height) + 20px + env(safe-area-inset-bottom));
            -webkit-overflow-scrolling: touch;
        }

        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0; height: var(--nav-height);
            background-color: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--surface-light); display: flex;
            justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 0.7rem; font-weight: 600; gap: 4px; cursor: pointer; transition: color 0.2s; width: 25%; }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
        .nav-item.active { color: var(--primary); transform: translateY(-2px); }

        .auth-container { display: flex; flex-direction: column; justify-content: center; min-height: 100%; padding: 20px; z-index: 50; background: var(--bg); position: absolute; inset: 0; }
        .auth-tabs { display: flex; margin-bottom: 30px; background: var(--surface); border-radius: var(--radius); padding: 4px; }
        .auth-tab { flex: 1; padding: 12px; text-align: center; color: var(--text-muted); cursor: pointer; font-weight: 700; border-radius: 10px; transition: 0.3s; }
        .auth-tab.active { background: var(--primary); color: #000; box-shadow: 0 2px 10px rgba(255, 215, 0, 0.3); }
        .form-group { margin-bottom: 20px; }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
        .toast { background: var(--surface-light); color: white; padding: 16px 20px; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), fadeOut 0.4s ease 3.6s forwards; border-left: 4px solid var(--primary); backdrop-filter: blur(10px); }
        .toast.error { border-left-color: var(--danger); }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }

        #modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            z-index: 10001; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box { background: var(--surface); width: 90%; max-width: 340px; border-radius: 20px; padding: 24px; transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; border: 1px solid var(--surface-light); }
        #modal-overlay.active .modal-box { transform: scale(1); }

        .pin-display { font-size: 3rem; font-weight: 900; letter-spacing: 10px; color: var(--primary); text-align: center; background: var(--surface-light); padding: 20px; border-radius: var(--radius); margin: 16px 0; border: 2px dashed var(--primary); }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .map-container { width: 100%; height: 180px; border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; border: 1px solid var(--surface-light); background: #1a1a1a; }
        .map-container iframe { width: 100%; height: 100%; border: none; filter: grayscale(80%) invert(90%) contrast(120%); }

        .timeline { display: flex; justify-content: space-between; margin: 20px 0; position: relative; padding: 0 10px; }
        .timeline::before { content: ''; position: absolute; top: 12px; left: 30px; right: 30px; height: 2px; background: var(--surface-light); z-index: 1; }
        .timeline-step { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .timeline-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-light); display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); transition: 0.3s; }
        .timeline-dot.active { background: var(--primary); box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
        .timeline-dot svg { width: 12px; height: 12px; fill: #000; }
        .timeline-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .timeline-step.active .timeline-label { color: var(--primary); }
        
        .copy-btn { background: none; border: none; color: var(--text-muted); padding: 4px; cursor: pointer; }
        .copy-btn svg { width: 16px; height: 16px; fill: currentColor; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <path d="M130 10 L60 110 L100 110 L70 190 L150 80 L110 80 Z" fill="#FFD700"/>
                <circle cx="120" cy="70" r="12" fill="#000"/>
                <path d="M120 82 C100 90 80 100 60 90 C50 85 30 80 20 90 C40 95 60 100 70 110 C80 120 100 115 120 105 Z" fill="#000"/>
                <path d="M110 105 L130 95 L140 105 L120 115 Z" fill="#000"/>
            </svg>
            <div class="logo-text">FLASH</div>
        </div>
        <p class="mt-2 text-muted text-sm font-bold">Fast rides. Fair for everyone.</p>
    </div>

    <div id="modal-overlay">
        <div class="modal-box">
            <h2 id="modal-title" class="font-bold text-lg mb-1">Title</h2>
            <p id="modal-desc" class="text-muted text-sm mb-3">Description</p>
            <div class="flex w-full" style="gap: 10px;">
                <button class="btn-outline w-full" id="modal-cancel">Cancel</button>
                <button class="btn-primary w-full" id="modal-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <div id="app" class="hidden">
        <header class="app-header">
            <div class="header-logo">
                <svg viewBox="0 0 24 24"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z"/></svg>
                <h1 id="header-title">FLASH</h1>
            </div>
            <button class="btn-outline btn-sm" id="btn-exit-driver" style="display:none;">Exit Driver</button>
        </header>
        
        <main id="main-content"></main>
        
        <nav class="bottom-nav" id="bottom-nav">
            <div class="nav-item active" data-view="home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </div>
            <div class="nav-item" data-view="active">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <span>Ride</span>
            </div>
            <div class="nav-item" data-view="history">
                <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                <span>History</span>
            </div>
            <div class="nav-item" data-view="profile">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Profile</span>
            </div>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, addDoc, deleteDoc, collection, query, where, onSnapshot, updateDoc, serverTimestamp, runTransaction, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCzsWEbfQRWlGQIsY7z_BP_xQoiYqdeDI",
            authDomain: "flash-254cb.firebaseapp.com",
            projectId: "flash-254cb",
            storageBucket: "flash-254cb.firebasestorage.app",
            messagingSenderId: "1082981177046",
            appId: "1:1082981177046:web:d39efebca5de8fd7d11b77",
            measurementId: "G-D6L3KDZQRG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userProfile = null;
        let currentMode = 'customer';
        let activeRideId = null;
        let listeners = [];
        
        const appEl = document.getElementById('app');
        const splashEl = document.getElementById('splash-screen');
        const mainContent = document.getElementById('main-content');
        const bottomNav = document.getElementById('bottom-nav');
        const headerTitle = document.getElementById('header-title');
        const btnExitDriver = document.getElementById('btn-exit-driver');

        function playSound(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if(type === 'success') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); 
                } else if (type === 'alert') {
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                }
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) { console.log("Audio not supported"); }
        }

        function showModal(title, desc, onConfirm) {
            const overlay = document.getElementById('modal-overlay');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            overlay.classList.add('active');
            
            document.getElementById('modal-confirm').onclick = () => {
                overlay.classList.remove('active');
                onConfirm();
            };
            document.getElementById('modal-cancel').onclick = () => {
                overlay.classList.remove('active');
            };
        }

        function showToast(msg, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.textContent = msg;
            container.appendChild(toast);
            if(!isError) playSound('success'); else playSound('alert');
            setTimeout(() => toast.remove(), 4000);
        }

        function setLoading(btn, isLoading) {
            if (!btn) return;
            if (isLoading) {
                btn.dataset.originalText = btn.innerHTML;
                btn.innerHTML = '<div class="loader"></div>';
                btn.disabled = true;
            } else {
                btn.innerHTML = btn.dataset.originalText;
                btn.disabled = false;
            }
        }

        function cleanupListeners() { 
            listeners.forEach(unsub => unsub()); 
            listeners = []; 
        }
        
        function formatDate(ts) { 
            if(!ts) return 'N/A'; 
            const d = ts.toDate ? ts.toDate() : new Date(ts); 
            return d.toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }); 
        }
        
        // FIXED PIN GENERATOR (Uber/Rapido Style)
        function generateFixedPIN() { 
            return Math.floor(1000 + Math.random() * 9000).toString(); 
        }

        function renderAuth() {
            cleanupListeners(); 
            appEl.classList.add('hidden'); 
            splashEl.classList.add('hidden');
            
            let authOverlay = document.getElementById('auth-overlay');
            if (!authOverlay) {
                authOverlay = document.createElement('div'); 
                authOverlay.id = 'auth-overlay'; 
                authOverlay.className = 'auth-container'; 
                document.body.appendChild(authOverlay);
            }
            authOverlay.classList.remove('hidden');
            
            authOverlay.innerHTML = `
                <div class="text-center mb-3">
                    <div class="logo-container" style="animation: none;">
                        <div class="logo-text" style="font-size: 2.5rem;">FLASH</div>
                    </div>
                </div>
                
                <div class="auth-tabs">
                    <div class="auth-tab active" id="tab-login">Login</div>
                    <div class="auth-tab" id="tab-signup">Sign Up</div>
                </div>
                
                <form id="form-login">
                    <div class="form-group"><label>Email</label><input type="email" id="login-email" required placeholder="you@example.com"></div>
                    <div class="form-group"><label>Password</label><input type="password" id="login-password" required placeholder="••••••••"></div>
                    <button type="submit" class="btn-primary w-full mt-2" id="btn-login">Sign In</button>
                    <p class="text-center mt-3 text-sm text-muted" id="link-forgot" style="cursor:pointer;">Forgot Password?</p>
                </form>
                
                <form id="form-signup" class="hidden">
                    <div class="form-group"><label>Full Name</label><input type="text" id="signup-name" required placeholder="John Doe"></div>
                    <div class="form-group"><label>Phone Number</label><input type="tel" id="signup-phone" required placeholder="+91 9876543210"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="signup-email" required placeholder="you@example.com"></div>
                    <div class="form-group"><label>Password (min 6 chars)</label><input type="password" id="signup-password" required minlength="6" placeholder="••••••••"></div>
                    <button type="submit" class="btn-primary w-full mt-2" id="btn-signup">Create Account</button>
                </form>
            `;

            document.getElementById('tab-login').onclick = () => { 
                document.getElementById('tab-login').classList.add('active'); document.getElementById('tab-signup').classList.remove('active'); 
                document.getElementById('form-login').classList.remove('hidden'); document.getElementById('form-signup').classList.add('hidden'); 
            };
            document.getElementById('tab-signup').onclick = () => { 
                document.getElementById('tab-signup').classList.add('active'); document.getElementById('tab-login').classList.remove('active'); 
                document.getElementById('form-signup').classList.remove('hidden'); document.getElementById('form-login').classList.add('hidden'); 
            };

            document.getElementById('form-login').onsubmit = async (e) => {
                e.preventDefault(); const btn = document.getElementById('btn-login'); setLoading(btn, true);
                try { await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value); } 
                catch (error) { showToast(error.message.replace('Firebase: ', ''), true); } finally { setLoading(btn, false); }
            };

            document.getElementById('form-signup').onsubmit = async (e) => {
                e.preventDefault(); const btn = document.getElementById('btn-signup'); setLoading(btn, true);
                try {
                    const uc = await createUserWithEmailAndPassword(auth, document.getElementById('signup-email').value, document.getElementById('signup-password').value);
                    
                    // Generate a fixed PIN for the customer
                    const fixedPIN = generateFixedPIN();

                    await setDoc(doc(db, "users", uc.user.uid), { 
                        uid: uc.user.uid, name: document.getElementById('signup-name').value, 
                        email: document.getElementById('signup-email').value, phone: document.getElementById('signup-phone').value, 
                        pin: fixedPIN, // Save fixed PIN
                        createdAt: serverTimestamp() 
                    });
                } catch (error) { showToast(error.message.replace('Firebase: ', ''), true); } finally { setLoading(btn, false); }
            };

            document.getElementById('link-forgot').onclick = async () => {
                const email = document.getElementById('login-email').value; 
                if (!email) return showToast("Enter your email first", true);
                try { await sendPasswordResetEmail(auth, email); showToast("Reset link sent!"); } catch (error) { showToast(error.message.replace('Firebase: ', ''), true); }
            };
        }

        onAuthStateChanged(auth, async (user) => {
            const authOverlay = document.getElementById('auth-overlay');
            if (user) {
                currentUser = user; 
                if (authOverlay) authOverlay.remove();
                try {
                    const docRef = doc(db, "users", user.uid); const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) { 
                        userProfile = docSnap.data(); 
                        // Fallback: If existing user doesn't have a fixed PIN, generate one now
                        if (!userProfile.pin) {
                            userProfile.pin = generateFixedPIN();
                            await updateDoc(docRef, { pin: userProfile.pin });
                        }
                    } 
                    else {
                        const fixedPIN = generateFixedPIN();
                        const newProfile = { uid: user.uid, name: "Flash User", email: user.email, phone: "0000000000", pin: fixedPIN, createdAt: serverTimestamp() };
                        await setDoc(docRef, newProfile); userProfile = newProfile;
                    }
                    splashEl.classList.add('hidden'); appEl.classList.remove('hidden'); switchMode('customer');
                } catch (error) { showToast("DB Error: " + error.message, true); setTimeout(() => renderAuth(), 4000); }
            } else {
                currentUser = null; userProfile = null; activeRideId = null; cleanupListeners(); appEl.classList.add('hidden'); renderAuth();
            }
        });

        function switchMode(mode) {
            currentMode = mode; activeRideId = null; cleanupListeners();
            if (mode === 'customer') {
                headerTitle.innerText = "FLASH"; btnExitDriver.style.display = 'none';
                bottomNav.style.display = 'flex'; renderCustomerHome(); 
            } else {
                headerTitle.innerText = "Driver Dashboard"; btnExitDriver.style.display = 'block';
                bottomNav.style.display = 'none'; renderDriverDashboard(); 
            }
        }

        btnExitDriver.onclick = () => { switchMode('customer'); };

        bottomNav.onclick = (e) => {
            const navItem = e.target.closest('.nav-item'); if (!navItem) return;
            bottomNav.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active')); navItem.classList.add('active');
            if (navItem.dataset.view === 'home') renderCustomerHome();
            if (navItem.dataset.view === 'active') renderActiveRide();
            if (navItem.dataset.view === 'history') renderRideHistory();
            if (navItem.dataset.view === 'profile') renderProfile();
        };

        // --- CUSTOMER FLOW ---
        function renderCustomerHome() {
            cleanupListeners(); bottomNav.style.display = 'flex';
            bottomNav.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            bottomNav.querySelector('[data-view="home"]').classList.add('active');

            mainContent.innerHTML = `
                <div class="mb-2"><h2 class="font-bold text-lg">Hey, ${userProfile.name.split(' ')[0]}!</h2><p class="text-muted text-sm">Ready to flash to your destination?</p></div>
                <div class="card">
                    <form id="form-book-ride">
                        <div class="form-group"><label>Pickup Location</label><input type="text" id="pickup" required placeholder="Enter pickup address"></div>
                        <div class="form-group"><label>Where to?</label><input type="text" id="destination" required placeholder="Enter destination"></div>
                        <div class="form-group"><label>Contact Number</label><input type="tel" id="contact-phone" required value="${userProfile.phone || ''}"></div>
                        <div class="form-group"><label>Vehicle Type</label><select id="ride-type"><option value="bike">Bike (Fastest)</option></select></div>
                        <div class="form-group"><label>Note for Driver (Optional)</label><textarea id="instructions" rows="2" placeholder="e.g. I'm at the main gate"></textarea></div>
                        <button type="submit" class="btn-primary w-full mt-2" id="btn-book">Confirm Booking</button>
                    </form>
                </div>
            `;
            document.getElementById('form-book-ride').onsubmit = async (e) => {
                e.preventDefault(); const btn = document.getElementById('btn-book'); setLoading(btn, true);
                try {
                    const docRef = await addDoc(collection(db, "rides"), {
                        customerUid: currentUser.uid, customerName: userProfile.name, phone: document.getElementById('contact-phone').value,
                        pickup: document.getElementById('pickup').value, destination: document.getElementById('destination').value,
                        rideType: document.getElementById('ride-type').value, instructions: document.getElementById('instructions').value,
                        status: 'requested', 
                        pin: userProfile.pin, // Use FIXED PIN instead of generating a new one
                        createdAt: serverTimestamp(), driverUid: null
                    });
                    showToast("Ride requested!");
                    bottomNav.querySelector('[data-view="active"]').click();
                } catch (error) { showToast("Failed: " + error.message, true); setLoading(btn, false); }
            };
        }

        function renderTimeline(status) {
            const steps = ['requested', 'accepted', 'arrived', 'in_progress'];
            let idx = steps.indexOf(status);
            if(status === 'completed') idx = 4;

            return `
            <div class="timeline">
                ${steps.map((s, i) => `
                    <div class="timeline-step ${i <= idx ? 'active' : ''}">
                        <div class="timeline-dot ${i <= idx ? 'active' : ''}">
                            ${i <= idx ? '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' : ''}
                        </div>
                        <span class="timeline-label">${s.replace('_',' ')}</span>
                    </div>
                `).join('')}
            </div>`;
        }

        function renderActiveRide() {
            cleanupListeners();
            mainContent.innerHTML = `<div class="text-center mt-3"><div class="loader" style="margin: 0 auto;"></div></div>`;
            const q = query(collection(db, "rides"), where("customerUid", "==", currentUser.uid), where("status", "in", ["requested", "accepted", "arrived", "in_progress"]));
            
            const unsub = onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    mainContent.innerHTML = `<div class="text-center mt-3"><p class="text-muted">No active rides right now.</p><button class="btn-primary mt-2" onclick="document.querySelector('[data-view=\\'home\\']').click()">Book a Ride</button></div>`;
                    return;
                }
                const rideDoc = snapshot.docs[0]; activeRideId = rideDoc.id; 
                const ride = rideDoc.data();
                
                let driverInfo = ''; let pinSection = '';
                if (ride.status === 'requested') pinSection = `<div class="card mt-2 text-center"><p class="text-muted text-sm mb-1">Share this PIN with driver</p><div class="pin-display">${ride.pin}</div></div>`;
                else if (['accepted', 'arrived', 'in_progress'].includes(ride.status)) {
                    driverInfo = `<div class="card mt-2" style="border-color: var(--primary); background: rgba(255,215,0,0.05);"><h3 class="font-bold mb-1 text-primary">Driver Details</h3><p>Name: ${ride.driverName}</p><p>Phone: ${ride.driverPhone}</p></div>`;
                    if (ride.status === 'accepted' || ride.status === 'arrived') pinSection = `<div class="card mt-2 text-center"><p class="text-muted text-sm mb-1">Ride Start PIN</p><div class="pin-display">${ride.pin}</div></div>`;
                }
                const waText = encodeURIComponent(`FLASH Ride:\nFrom: ${ride.pickup}\nTo: ${ride.destination}`);
                const mapEmbed = `<div class="map-container mt-2"><iframe src="https://maps.google.com/maps?q=${encodeURIComponent(ride.pickup)}&output=embed"></iframe></div>`;

                mainContent.innerHTML = `
                    <div class="flex justify-between items-center mb-1"><h2 class="font-bold text-lg">Active Ride</h2><span class="badge badge-${ride.status}">${ride.status.replace('_', ' ')}</span></div>
                    ${renderTimeline(ride.status)}
                    ${mapEmbed}
                    <div class="card">
                        <div class="flex flex-col" style="gap: 12px;">
                            <div><p class="text-sm text-muted">Pickup</p><p class="font-bold">${ride.pickup}</p></div>
                            <div><p class="text-sm text-muted">Destination</p><p class="font-bold">${ride.destination}</p></div>
                        </div>
                    </div>
                    ${driverInfo} ${pinSection}
                    ${ride.status === 'requested' ? `
                        <div class="flex w-full" style="gap: 10px; margin-top: 16px;">
                            <a href="https://wa.me/?text=${waText}" target="_blank" class="btn-outline w-full" style="text-decoration: none;">WhatsApp</a>
                            <button class="btn-danger w-full" id="btn-cancel-ride">Cancel</button>
                        </div>` : ''}
                `;
                const cBtn = document.getElementById('btn-cancel-ride');
                if (cBtn) {
                    cBtn.onclick = () => { 
                        showModal("Cancel Ride?", "Are you sure? This ride will be completely removed.", async () => {
                            setLoading(cBtn, true);
                            try { await deleteDoc(doc(db, "rides", activeRideId)); showToast("Ride cancelled."); } 
                            catch (e) { showToast(e.message, true); setLoading(cBtn, false); }
                        });
                    };
                }
            });
            listeners.push(unsub);
        }

        function renderRideHistory() {
            cleanupListeners();
            mainContent.innerHTML = `<h2 class="font-bold text-lg mb-2">History</h2><div class="text-center mt-3"><div class="loader" style="margin: 0 auto;"></div></div>`;
            const q = query(collection(db, "rides"), where("customerUid", "==", currentUser.uid), where("status", "in", ["completed", "cancelled"]), orderBy("createdAt", "desc"), limit(20));
            const unsub = onSnapshot(q, (snapshot) => {
                if (snapshot.empty) { mainContent.innerHTML = `<h2 class="font-bold text-lg mb-2">History</h2><p class="text-muted text-center mt-3">No past rides.</p>`; return; }
                let html = `<h2 class="font-bold text-lg mb-2">History</h2>`;
                snapshot.forEach(doc => { 
                    const r = doc.data(); 
                    html += `
                    <div class="card">
                        <div class="flex justify-between mb-1"><span class="badge badge-${r.status}">${r.status}</span><span class="text-xs text-muted">${formatDate(r.createdAt)}</span></div>
                        <p class="text-sm font-bold mt-1">${r.destination}</p>
                        <p class="text-xs text-muted">From: ${r.pickup}</p>
                    </div>`; 
                });
                mainContent.innerHTML = html;
            });
            listeners.push(unsub);
        }

        function renderProfile() {
            cleanupListeners();
            mainContent.innerHTML = `
                <h2 class="font-bold text-lg mb-2">Profile</h2>
                <div class="card flex items-center gap-3">
                    <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--primary); color: #000; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold;">
                        ${userProfile.name.charAt(0).toUpperCase()}
                    </div>
                    <div>
                        <p class="font-bold text-lg">${userProfile.name}</p>
                        <p class="text-sm text-muted">${userProfile.email}</p>
                        <p class="text-sm text-muted">${userProfile.phone}</p>
                    </div>
                </div>

                <!-- Fixed PIN Display -->
                <div class="card" style="border-color: var(--primary);">
                    <p class="text-sm text-muted mb-1">Your Ride Start PIN</p>
                    <div class="pin-display" style="margin: 0;">${userProfile.pin}</div>
                    <p class="text-xs text-muted mt-2 text-center">Share this PIN with the driver to start your ride.</p>
                </div>
                
                <div class="card" style="border-color: var(--primary); background: linear-gradient(145deg, rgba(255,215,0,0.1), transparent);">
                    <h3 class="font-bold mb-1 text-primary">Become a Driver</h3>
                    <p class="text-sm text-muted mb-2">Zero commission. Keep 100% of your earnings.</p>
                    <button class="btn-primary w-full" id="btn-become-driver">Switch to Driver Mode</button>
                </div>

                <button class="btn-outline w-full mt-2" id="btn-logout">Logout</button>
            `;
            document.getElementById('btn-become-driver').onclick = () => { switchMode('driver'); };
            document.getElementById('btn-logout').onclick = () => { 
                showModal("Logout?", "You will need to login again.", () => { signOut(auth); });
            };
        }

        // --- DRIVER FLOW ---
        function renderDriverDashboard() {
            cleanupListeners();
            mainContent.innerHTML = `<div class="text-center mt-3"><div class="loader" style="margin: 0 auto;"></div></div>`;
            
            const qActive = query(collection(db, "rides"), where("driverUid", "==", currentUser.uid), where("status", "in", ["accepted", "arrived", "in_progress"]));
            
            const unsubActive = onSnapshot(qActive, (snapshot) => {
                if (!snapshot.empty) {
                    const rideDoc = snapshot.docs[0]; 
                    renderDriverActiveRideUI(rideDoc.id, rideDoc.data());
                } else {
                    renderAvailableRides();
                }
            }, (error) => { showToast("Error: " + error.message, true); });
            listeners.push(unsubActive);
        }

        function renderAvailableRides() {
            mainContent.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <div>
                        <h2 class="font-bold text-primary text-lg">Available Rides</h2>
                        <p class="text-muted text-sm">Accept a ride to start earning.</p>
                    </div>
                    <button class="btn-outline btn-sm" onclick="renderDriverDashboard()">Refresh</button>
                </div>
                <div id="rides-list"><div class="loader" style="margin: 20px auto;"></div></div>
            `;
            
            const q = query(collection(db, "rides"), where("status", "==", "requested"), orderBy("createdAt", "desc"));
            
            const unsub = onSnapshot(q, (snapshot) => {
                const listEl = document.getElementById('rides-list'); 
                if (!listEl) return;
                
                if (snapshot.empty) { 
                    listEl.innerHTML = `<div class="text-center mt-3 text-muted"><p>No rides available right now.</p></div>`; 
                    return; 
                }
                
                let html = ''; let count = 0;
                
                snapshot.forEach(doc => {
                    const ride = doc.data();
                    if(ride.customerUid === currentUser.uid) return; 
                    count++;
                    html += `
                    <div class="card">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs text-muted">${formatDate(ride.createdAt)}</span>
                            <span class="badge badge-requested">${ride.rideType}</span>
                        </div>
                        <p class="text-sm"><span class="text-muted">From:</span> <span class="font-bold">${ride.pickup}</span></p>
                        <p class="text-sm mb-2"><span class="text-muted">To:</span> <span class="font-bold">${ride.destination}</span></p>
                        <button class="btn-primary w-full accept-btn" data-id="${doc.id}">Accept Ride</button>
                    </div>`;
                });
                
                if (count === 0) {
                     listEl.innerHTML = `<div class="text-center mt-3 text-muted"><p>No rides available.</p></div>`;
                } else {
                     listEl.innerHTML = html;
                }
                
                listEl.querySelectorAll('.accept-btn').forEach(btn => {
                    btn.onclick = async (e) => {
                        const rideId = e.target.dataset.id; 
                        setLoading(e.target, true);
                        try {
                            await runTransaction(db, async (transaction) => {
                                const rideRef = doc(db, "rides", rideId); 
                                const rideDoc = await transaction.get(rideRef);
                                if (!rideDoc.exists()) throw new Error("Ride no longer exists.");
                                if (rideDoc.data().status !== 'requested') throw new Error("Ride already accepted.");
                                
                                transaction.update(rideRef, { 
                                    status: 'accepted', 
                                    driverUid: currentUser.uid, 
                                    driverName: userProfile.name, 
                                    driverPhone: userProfile.phone, 
                                    acceptedAt: serverTimestamp() 
                                });
                            });
                            showToast("Ride accepted!");
                        } catch (error) { 
                            showToast(error.message, true); 
                            setLoading(e.target, false); 
                        }
                    };
                });
            }, (error) => {
                const listEl = document.getElementById('rides-list');
                if (listEl) {
                    listEl.innerHTML = `
                        <div class="card" style="border-color: var(--danger); background: rgba(255,68,68,0.05);">
                            <p class="text-danger font-bold">Database Error!</p>
                            <p class="text-sm mt-1">${error.message}</p>
                        </div>`;
                }
            });
            listeners.push(unsub);
        }

        function renderDriverActiveRideUI(rideId, ride) {
            let actionSection = '';
            let cancelBtnSection = '';
            const pickupMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ride.pickup)}`;
            const dropMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ride.destination)}`;
            
            if (ride.status === 'accepted') {
                actionSection = `<button class="btn-primary w-full mt-2" id="btn-arrived">I've Arrived at Pickup</button>`;
                cancelBtnSection = `<button class="btn-danger w-full mt-2" id="btn-release-ride">Cancel & Release Ride</button>`;
            } else if (ride.status === 'arrived') {
                actionSection = `<div class="card mt-2"><label>Enter Customer's PIN</label><input type="number" id="start-pin" placeholder="0000" style="text-align: center; font-size: 1.5rem; letter-spacing: 5px; margin-bottom: 10px;"><button class="btn-primary w-full" id="btn-start-ride">Start Ride</button></div>`;
                cancelBtnSection = `<button class="btn-danger w-full mt-2" id="btn-release-ride">Cancel & Release Ride</button>`;
            } else if (ride.status === 'in_progress') {
                actionSection = `<button class="btn-primary w-full mt-2" id="btn-complete-ride">Complete Ride</button>`;
            }

            mainContent.innerHTML = `
                <div class="flex justify-between items-center mb-1"><h2 class="font-bold text-primary text-lg">Active Ride</h2><span class="badge badge-${ride.status}">${ride.status.replace('_', ' ')}</span></div>
                ${renderTimeline(ride.status)}
                <div class="card" style="border-color: var(--primary);">
                    <div class="flex justify-between items-center mb-3">
                        <div>
                            <p class="text-xs text-muted">CUSTOMER</p>
                            <p class="font-bold">${ride.customerName}</p>
                            <p class="text-sm">${ride.phone}</p>
                        </div>
                        <button class="btn-outline btn-sm" id="btn-copy-details">Copy Info</button>
                    </div>
                    
                    <div class="map-container"><iframe src="https://maps.google.com/maps?q=${encodeURIComponent(ride.pickup)}&output=embed"></iframe></div>
                    
                    <div class="flex justify-between items-center mb-2">
                        <div><p class="text-xs text-muted">PICKUP</p><p class="font-bold text-sm">${ride.pickup}</p></div>
                        <a href="${pickupMapUrl}" target="_blank" class="btn-primary btn-sm" style="text-decoration:none;">Open Map</a>
                    </div>
                    <div class="flex justify-between items-center">
                        <div><p class="text-xs text-muted">DROP</p><p class="font-bold text-sm">${ride.destination}</p></div>
                        <a href="${dropMapUrl}" target="_blank" class="btn-primary btn-sm" style="text-decoration:none;">Open Map</a>
                    </div>
                </div>
                ${actionSection} ${cancelBtnSection}
            `;

            document.getElementById('btn-copy-details').onclick = () => {
                const text = `FLASH Ride:\nCustomer: ${ride.customerName}\nPhone: ${ride.phone}\nPickup: ${ride.pickup}\nDrop: ${ride.destination}`;
                navigator.clipboard.writeText(text).then(() => { showToast("Details copied!"); });
            };

            const btnArrived = document.getElementById('btn-arrived');
            if (btnArrived) btnArrived.onclick = async () => { setLoading(btnArrived, true); try { await updateDoc(doc(db, "rides", rideId), { status: 'arrived', arrivedAt: serverTimestamp() }); showToast("Arrived!"); } catch (e) { showToast(e.message, true); setLoading(btnArrived, false); } };

            const btnStart = document.getElementById('btn-start-ride');
            if (btnStart) {
                btnStart.onclick = async () => {
                    const enteredPin = document.getElementById('start-pin').value;
                    if (enteredPin.length !== 4) return showToast("Enter 4-digit PIN", true);
                    setLoading(btnStart, true);
                    try {
                        await runTransaction(db, async (transaction) => {
                            const rideRef = doc(db, "rides", rideId); const rideDoc = await transaction.get(rideRef);
                            
                            // FIX: Strict String Comparison with Trim
                            const dbPin = String(rideDoc.data().pin).trim();
                            const inputPin = String(enteredPin).trim();

                            if (dbPin !== inputPin) throw new Error("Incorrect PIN. Please check with customer.");
                            
                            transaction.update(rideRef, { status: 'in_progress', startedAt: serverTimestamp() });
                        });
                        showToast("Ride Started!");
                    } catch (e) { showToast(e.message, true); setLoading(btnStart, false); }
                };
            }

            const btnComplete = document.getElementById('btn-complete-ride');
            if (btnComplete) btnComplete.onclick = async () => { setLoading(btnComplete, true); try { await updateDoc(doc(db, "rides", rideId), { status: 'completed', completedAt: serverTimestamp() }); showToast("Ride Completed!"); } catch (e) { showToast(e.message, true); setLoading(btnComplete, false); } };

            const btnRelease = document.getElementById('btn-release-ride');
            if (btnRelease) {
                btnRelease.onclick = () => {
                    showModal("Release Ride?", "This ride will go back to the pool for other drivers.", async () => {
                        setLoading(btnRelease, true);
                        try {
                            await updateDoc(doc(db, "rides", rideId), { status: 'requested', driverUid: null, driverName: null, driverPhone: null, acceptedAt: null, arrivedAt: null });
                            showToast("Ride released.");
                        } catch (e) { showToast(e.message, true); setLoading(btnRelease, false); }
                    });
                };
            }
        }
    </script>
</body>
</html>
